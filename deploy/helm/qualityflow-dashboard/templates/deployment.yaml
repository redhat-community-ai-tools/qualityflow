apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
spec:
  # ponytail: hardcoded, not templated from values — task/rate state is
  # in-memory (see values.yaml). Do not raise this; there is no HPA here
  # and there must never be one until state moves out of the process.
  replicas: 1
  # Both PVCs are RWO and task state is in-memory, so a RollingUpdate is
  # unsafe here: k8s would try to schedule the new pod alongside the old
  # one before killing it, but two pods can't both mount the same RWO
  # volume, and even if they somehow did, the new pod's empty in-memory
  # state would diverge from the old pod's. Recreate tears the old pod
  # down first so there's never a moment with two pods claiming the PVCs
  # or splitting task state.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "qualityflow-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qualityflow-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      {{- $ps := .Values.image.pullSecrets | default list }}
      {{- if .Values.image.pullSecret.create }}
      {{- $ps = append $ps (dict "name" (printf "%s-pull" (include "qualityflow-dashboard.fullname" .))) }}
      {{- end }}
      {{- if $ps }}
      imagePullSecrets:
        {{- toYaml $ps | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "qualityflow-dashboard.fullname" . }}
      # Give the graceful-shutdown handler (drains in-flight requests, then
      # exits) time to finish before the kubelet SIGKILLs the container.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # No runAsUser/runAsGroup/fsGroup: OpenShift's restricted-v2 SCC
        # assigns an arbitrary UID from the namespace range and group 0.
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The image bakes the default config at /app/config, but QF_CONFIG_DIR
        # points at an empty PVC. Without this the dashboard starts with no
        # routing.yaml: project resolution silently falls back to a lowercased
        # Jira prefix and /api/projects returns [] — an unconfigured install
        # that reports no error.
        #
        # Not `cp -Rn`: exists-skip means a *changed* shipped default (a new
        # _schema.yaml, a new _defaults.yaml) is never applied on upgrade, so
        # an install keeps running the previous release's config against a new
        # image (D01-23). Instead we keep a manifest of the hash each file had
        # when we last seeded it, and overwrite only when the installed file
        # still hashes to that value — i.e. nobody (team, API, git sync) has
        # touched it since. A file the operator edited never matches, and is
        # left alone; a file with no manifest entry (first run after upgrading
        # to this chart) is also left alone, and only recorded, so the very
        # next upgrade can reason about it.
        - name: seed-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            # Falls back to the old exists-skip seed if python3 is not on PATH,
            # so a base-image change degrades to today's behaviour instead of
            # crash-looping the pod.
            - |
              python3 - <<'PY' || cp -Rn /app/config/. /data/config/ 2>/dev/null || true
              import hashlib, json, pathlib, shutil
              src, dst = pathlib.Path('/app/config'), pathlib.Path('/data/config')
              mf = dst / '.seed-manifest.json'
              try:
                  seeded = json.loads(mf.read_text())
              except Exception:
                  seeded = {}
              def h(p):
                  return hashlib.sha256(p.read_bytes()).hexdigest()
              now = {}
              for f in sorted(src.rglob('*')):
                  if not f.is_file():
                      continue
                  rel = str(f.relative_to(src))
                  t = dst / rel
                  copied = True
                  if not t.exists():
                      t.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(f, t)
                      print('seeded', rel)
                  elif seeded.get(rel) == h(t) != h(f):
                      shutil.copy2(f, t)
                      print('upgraded', rel)
                  else:
                      copied = False
                  # The manifest records the hash of the shipped default we
                  # believe is installed, never the hash of what is on disk:
                  # recording an operator's edit would read as "matches what we
                  # seeded" next time and license overwriting it.
                  now[rel] = h(f) if copied else seeded.get(rel, h(f))
              dst.mkdir(parents=True, exist_ok=True)
              mf.write_text(json.dumps(now, indent=0, sort_keys=True))
              PY
          volumeMounts:
            - name: config
              mountPath: /data/config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: qualityflow-dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "qualityflow-dashboard.fullname" . }}
            - secretRef:
                name: {{ include "qualityflow-dashboard.secretName" . }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: outputs
              mountPath: /data/outputs
            - name: config
              mountPath: /data/config
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: {{ include "qualityflow-dashboard.fullname" . }}-outputs
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "qualityflow-dashboard.fullname" . }}-config
