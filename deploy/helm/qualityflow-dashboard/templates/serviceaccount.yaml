apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
  {{- if .Values.auth.openshiftLogin.enabled }}
  annotations:
    # Lets the oauth-proxy use this account as its OAuth client, returning to the Route.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "qualityflow-dashboard.fullname" . }}"}}'
  {{- end }}
