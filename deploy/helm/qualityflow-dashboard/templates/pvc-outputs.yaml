apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}-outputs
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.outputs.size }}
