apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}-outputs
  annotations:
    # Survive `helm uninstall`: this volume holds the team's approvals, audit
    # log and coverage history, none of which can be regenerated by re-running
    # a pipeline. Delete it deliberately (`oc delete pvc ...`), not as a side
    # effect of an uninstall — see deploy/README.md "Troubleshooting".
    helm.sh/resource-policy: keep
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.outputs.size }}
