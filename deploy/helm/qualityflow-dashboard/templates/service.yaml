apiVersion: v1
kind: Service
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.auth.openshiftLogin.enabled }}
    - port: 4180
      targetPort: proxy
      protocol: TCP
      name: proxy
    {{- end }}
  selector:
    {{- include "qualityflow-dashboard.selectorLabels" . | nindent 4 }}
