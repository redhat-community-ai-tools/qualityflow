apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
data:
  # values.yaml's extraEnv escape hatch. First, so the chart-managed keys below
  # take precedence over a duplicate an operator sets here by accident.
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  PORT: {{ .Values.service.port | quote }}
  QF_HOST: "0.0.0.0"
  # The CLI runner writes relative to /app, so the outputs PVC must be mounted
  # at /app/outputs and the dashboard must read that same tree.
  QF_OUTPUTS_DIR: /app/outputs
  QF_CONFIG_DIR: /data/config
  QF_CLUSTER_LABEL: {{ .Values.clusterLabel | quote }}
  QUALITYFLOW_BASE_URL: {{ .Values.dashboardUrl | quote }}
  QF_LOG_FORMAT: {{ .Values.logging.format | quote }}
  QF_LOG_LEVEL: {{ .Values.logging.level | quote }}
  QF_FORWARDED_ALLOW_IPS: {{ .Values.network.forwardedAllowIps | quote }}
  CORS_ORIGINS: {{ .Values.cors.origins | quote }}
  QF_RUNNER: {{ if .Values.runner.enabled }}"cli"{{ else }}""{{ end }}
  {{- $a := .Values.auth }}
  {{- if not (or $a.apiKey $a.existingSecret .Values.oidc.enabled $a.jira $a.githubOrg $a.personalKeysSecret $a.openshiftLogin.enabled) }}
  # No sign-in configured — ui.py refuses to start without one unless
  # QF_DEV=1. That's the intended path for a cluster whose network access is
  # already restricted to the team; set auth.apiKey (or another auth.* way)
  # if writes need to be gated.
  QF_DEV: "1"
  {{- end }}
  {{- if and $a.jira (not $a.allowedDomains) }}
  {{- fail "auth.jira lets in every account your Jira knows: set auth.allowedDomains (e.g. example.com) too" }}
  {{- end }}
  {{- if $a.jira }}
  QF_AUTH_JIRA: "1"
  {{- end }}
  {{- if $a.githubOrg }}
  QF_AUTH_GITHUB_ORG: {{ $a.githubOrg | quote }}
  {{- end }}
  {{- if $a.allowedDomains }}
  QF_AUTH_ALLOWED_DOMAINS: {{ $a.allowedDomains | quote }}
  {{- end }}
  {{- if $a.personalKeysSecret }}
  QF_API_KEYS_FILE: /etc/qualityflow/keys/keys.yaml
  {{- end }}
  GIT_REPO_URL: {{ .Values.git.repoUrl | quote }}
  GIT_BRANCH: {{ .Values.git.branch | quote }}
  {{- if .Values.peers }}
  {{- $pairs := list }}
  {{- range .Values.peers }}{{ $pairs = append $pairs (printf "%s=%s" .label .url) }}{{- end }}
  QF_PEERS: {{ join "," $pairs | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_DISCOVERY_URL: {{ .Values.oidc.discoveryUrl | quote }}
  {{- if .Values.oidc.issuer }}
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  {{- end }}
  {{- if .Values.oidc.redirectUri }}
  OIDC_REDIRECT_URI: {{ .Values.oidc.redirectUri | quote }}
  {{- end }}
  OIDC_ALLOWED_DOMAINS: {{ .Values.oidc.allowedDomains | quote }}
  OIDC_ALLOWED_GROUPS: {{ .Values.oidc.allowedGroups | quote }}
  OIDC_PUBLIC_READ: {{ .Values.oidc.publicRead | quote }}
  {{- end }}
  {{- if .Values.claude.vertexProjectId }}
  CLAUDE_CODE_USE_VERTEX: "1"
  ANTHROPIC_VERTEX_PROJECT_ID: {{ .Values.claude.vertexProjectId | quote }}
  CLOUD_ML_REGION: {{ .Values.claude.region | quote }}
  {{- end }}
  {{- if .Values.claude.model }}
  CLAUDE_MODEL: {{ .Values.claude.model | quote }}
  {{- end }}
  {{- if .Values.tokens.jira.url }}
  JIRA_URL: {{ .Values.tokens.jira.url | quote }}
  {{- end }}
  {{- if .Values.tokens.jira.username }}
  JIRA_USERNAME: {{ .Values.tokens.jira.username | quote }}
  {{- end }}
  {{- if .Values.tokens.sonar.hostUrl }}
  SONAR_HOST_URL: {{ .Values.tokens.sonar.hostUrl | quote }}
  {{- end }}
