apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  QF_HOST: "0.0.0.0"
  QF_OUTPUTS_DIR: /data/outputs
  QF_CONFIG_DIR: /data/config
  QF_CLUSTER_LABEL: {{ .Values.clusterLabel | quote }}
  CORS_ORIGINS: {{ .Values.cors.origins | quote }}
  QF_RUNNER: {{ ternary "cli" "" .Values.runner.enabled | quote }}
  GIT_REPO_URL: {{ .Values.git.repoUrl | quote }}
  GIT_BRANCH: {{ .Values.git.branch | quote }}
  {{- if .Values.oidc.enabled }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_DISCOVERY_URL: {{ .Values.oidc.discoveryUrl | quote }}
  {{- if .Values.oidc.issuer }}
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  {{- end }}
  {{- if .Values.oidc.redirectUri }}
  OIDC_REDIRECT_URI: {{ .Values.oidc.redirectUri | quote }}
  {{- end }}
  OIDC_ALLOWED_DOMAINS: {{ .Values.oidc.allowedDomains | quote }}
  OIDC_ALLOWED_GROUPS: {{ .Values.oidc.allowedGroups | quote }}
  OIDC_PUBLIC_READ: {{ .Values.oidc.publicRead | quote }}
  {{- end }}
  {{- if .Values.tokens.jira.url }}
  JIRA_URL: {{ .Values.tokens.jira.url | quote }}
  {{- end }}
  {{- if .Values.tokens.jira.username }}
  JIRA_USERNAME: {{ .Values.tokens.jira.username | quote }}
  {{- end }}
  {{- if .Values.tokens.sonar.hostUrl }}
  SONAR_HOST_URL: {{ .Values.tokens.sonar.hostUrl | quote }}
  {{- end }}
