apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
rules:
  # Dashboard launches on-cluster coverage collection as Jobs. Least
  # privilege: ui.py creates a Job, GETs that one Job by name, and deletes
  # it. It never lists the jobs collection, so no `list` here.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  # ...and finds their pods by labelSelector (a collection LIST). It never
  # GETs a single pod by name — the status it wants is in the list result —
  # so `list` alone. pods/log and pods/proxy are separate subresources with
  # their own rules below; neither needs `get` on pods itself.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
