{{- if .Values.image.pullSecret.create }}
{{- $reg := .Values.image.pullSecret.registry }}
{{- $user := required "image.pullSecret.username is required when image.pullSecret.create is true" .Values.image.pullSecret.username }}
{{- $token := required "image.pullSecret.token is required when image.pullSecret.create is true" .Values.image.pullSecret.token }}
{{- $auth := printf "%s:%s" $user $token | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qualityflow-dashboard.fullname" . }}-pull
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}` $reg $user $token $auth | b64enc }}
{{- end }}
