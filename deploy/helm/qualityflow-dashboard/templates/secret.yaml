{{- if not .Values.auth.existingSecret }}
{{- $fullname := include "qualityflow-dashboard.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
{{- $sessionSecret := .Values.oidc.sessionSecret }}
{{- if and .Values.oidc.enabled (not $sessionSecret) }}
{{- if $existing }}
{{- $sessionSecret = index $existing.data "SESSION_SECRET" | default "" | b64dec }}
{{- end }}
{{- if not $sessionSecret }}
{{- $sessionSecret = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "qualityflow-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Optional — machine auth (CI upload, peer rollup) and the write-path
  # gate when OIDC is disabled. Left blank, the ConfigMap sets QF_DEV=1
  # instead (see configmap.yaml) so writes stay unauthenticated: a
  # deliberate call for a cluster whose network access is already
  # restricted to the team.
  {{- if .Values.auth.apiKey }}
  QUALITYFLOW_API_KEY: {{ .Values.auth.apiKey | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  SESSION_SECRET: {{ $sessionSecret | quote }}
  {{- if .Values.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.claude.apiKey }}
  ANTHROPIC_API_KEY: {{ .Values.claude.apiKey | quote }}
  {{- end }}
  {{- if .Values.tokens.github }}
  # Both names: GITHUB_TOKEN is what the check-run/PR-comment helpers read,
  # GITHUB_PERSONAL_ACCESS_TOKEN is what the module-level _GITHUB_TOKEN reads
  # first (push-PR, close-PR, org scan, bulk onboard). Setting only one left
  # half the GitHub features reporting "no token available" on a chart install.
  GITHUB_TOKEN: {{ .Values.tokens.github | quote }}
  GITHUB_PERSONAL_ACCESS_TOKEN: {{ .Values.tokens.github | quote }}
  {{- end }}
  {{- if .Values.tokens.gitlab }}
  GITLAB_PERSONAL_ACCESS_TOKEN: {{ .Values.tokens.gitlab | quote }}
  {{- end }}
  {{- if .Values.tokens.jira.apiToken }}
  JIRA_API_TOKEN: {{ .Values.tokens.jira.apiToken | quote }}
  {{- end }}
  {{- if .Values.tokens.sonar.token }}
  SONAR_TOKEN: {{ .Values.tokens.sonar.token | quote }}
  {{- end }}
  {{- if .Values.tokens.codecov }}
  CODECOV_API_TOKEN: {{ .Values.tokens.codecov | quote }}
  {{- end }}
{{- end }}
