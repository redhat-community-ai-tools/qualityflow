  ## 11. Glossary

  | Term | Definition |
  |---|---|
  | **NAD** | NetworkAttachmentDefinition -- CRD from `k8s.cni.cncf.io` API group defining a network attachment |
  | **VEP** | Virtual Enhancement Proposal -- KubeVirt's process for proposing significant changes |
  | **FG** | Feature Gate -- mechanism to enable/disable features |
  | **VMI** | VirtualMachineInstance -- the running instance of a VirtualMachine |
  | **DNC** | Dynamic Networks Controller -- Multus component for in-place hotplug/unplug of networks |
  | **CNI** | Container Network Interface -- standard for configuring network interfaces in Linux containers |
  | **HCO** | HyperConverged Operator -- operator managing CNV deployment on OpenShift |
  | **Bridge binding** | KubeVirt network binding connecting the VM to a Linux bridge on the host |
  | **Live Migration** | Moving a running VM from one node to another without stopping it |
  | **VLAN** | Virtual LAN -- network segmentation technique |
