  ## 4. Test Environment

  ### 4.1 Infrastructure Requirements

  | Component | Requirement |
  |---|---|
  | **OpenShift Cluster** | OCP 4.x with CNV installed |
  | **CNV Version** | CNV 4.18+ (supports `LiveUpdateNADRef` FG) |
  | **KubeVirt Version** | v1.8+ (upstream) |
  | **Multus CNI** | Installed and configured |
  | **Bridge CNI Plugin** | `cnv-bridge` or `bridge` CNI plugin available |
  | **Worker Nodes** | At least 2 schedulable worker nodes (for live migration) |
  | **Storage** | Shared storage (e.g., ODF, NFS) for live migration support |
  | **Network** | Physical or virtual network supporting VLANs (for realistic NAD testing) |

  ### 4.2 NAD Configuration

  Two or more NADs with different configurations (e.g., different VLAN IDs or different bridges) should be pre-created. Example:

  ```yaml
  apiVersion: k8s.cni.cncf.io/v1
  kind: NetworkAttachmentDefinition
  metadata:
    name: nad-vlan10
  spec:
    config: '{
      "cniVersion": "0.3.1",
      "name": "nad-vlan10",
      "type": "cnv-bridge",
      "bridge": "br-test",
      "vlan": 10,
      "macspoofchk": true,
      "ipam": {}
    }'
  ```

  ### 4.3 Feature Gate Enablement

  Via HCO (downstream):
  ```yaml
  apiVersion: hco.kubevirt.io/v1beta1
  kind: HyperConverged
  spec:
    featureGates:
      LiveUpdateNADRef: true
  ```

  Or KubeVirt CR (upstream):
  ```yaml
  apiVersion: kubevirt.io/v1
  kind: KubeVirt
  spec:
    configuration:
      developerConfiguration:
        featureGates:
          - LiveUpdateNADRef
  ```

  ---

