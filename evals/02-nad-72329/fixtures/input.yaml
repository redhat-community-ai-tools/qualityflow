  ## 1. Introduction

  ### 1.1 Purpose

  This Software Test Plan (STP) defines the testing approach, scope, strategy, environment, and high-level test case inventory for the **NAD Reference Live Update** feature (CNV-72329). It answers **what** will be tested and **why**, at a strategic level. Detailed test procedures (preconditions, steps, expected results) are documented separately in the **STD** (Software Test Design, CNV-78930).

  ### 1.2 Test Framework

  Downstream QE tests are implemented in **Python/pytest** in the [`openshift-virtualization-tests`](https://github.com/RedHatQE/openshift-virtualization-tests) repository, following the project's [Software Test Description](docs/SOFTWARE_TEST_DESCRIPTION.md) convention. STDs are written as **test descriptions in code** -- Python test stubs with docstrings containing `Preconditions / Steps / Expected`, merged as a Phase 1 PR before automation implementation (Phase 2).

  Test location: `tests/network/nad_live_update/test_nad_ref_live_update.py`

  ### 1.3 Feature Overview

  VMs using secondary networks refer to a `NetworkAttachmentDefinition` (NAD) object via `spec.template.spec.networks[].multus.networkName`. Prior to this feature, changing the NAD reference required a VM restart.

  This feature introduces the `LiveUpdateNADRef` feature gate which, when enabled, allows users to update the NAD reference on a running VM. The change triggers an automatic Live Migration to a new pod whose multus annotation refers to the new NAD, rather than requiring a `RestartRequired` condition and manual reboot.

  ### 1.4 Motivation

  - **Avoid workload disruption**: VM restart impacts the guest workload; live migration is transparent to the guest.
  - **Preserve guest interface properties**: Unlike hotplugging a new interface (which changes MAC address, interface name, etc.), this approach preserves all guest-visible interface properties.
  - **Use case**: Re-assign VMs to a different VLAN, move to a better/worse link, or isolate to a different network segment -- all without guest awareness.

