  ## 2. Scope

  ### 2.1 In Scope

  | Area | Description |
  |---|---|
  | NAD reference live update | Changing `networkName` on a running VM triggers migration instead of restart |
  | Bridge binding | Secondary network interfaces using `bridge` binding |
  | Live Migration trigger | Automatic migration triggered when NAD reference changes |
  | Feature Gate behavior | `LiveUpdateNADRef` enable/disable behavior |
  | RestartRequired condition | Verifying correct condition behavior based on FG state |
  | VM spec sync | VMI spec updated with new networkName from VM spec |
  | Multiple networks | VM with multiple secondary networks, updating one or more NAD refs |
  | DNC compatibility | Behavior on clusters with/without Multus Dynamic Networks Controller |
  | HCO integration | Feature gate enabled via HyperConverged operator |
  | CLI/API | Changes via `kubectl patch`, `virtctl`, and direct API |

  ### 2.2 Out of Scope

  | Area | Reason |
  |---|---|
  | Migrating between different CNI types | Explicitly listed as non-goal in VEP #140 |
  | Changing the network binding/plugin | Non-goal |
  | Seamless network connectivity during migration | Non-goal; brief connectivity interruption is expected |
  | Non-migratable VMs | Feature requires live migration capability |
  | Guest network reconfiguration (e.g., DHCP renewal) | Out of scope |
  | SR-IOV or other non-bridge bindings | Current scope is bridge binding only (per VEP Beta) |
  | Limiting migration retries for missing NAD | Non-goal per VEP |
  | UI/Console testing | Separate test effort |

  ---

  ## 3. Test Strategy

  ### 3.1 Test Levels

  | Level | Description | Responsibility | Framework |
  |---|---|---|---|
  | **Unit Tests** | Controller logic for restart evaluation, migration evaluation, VM sync | Dev (included in implementation PR) | Go (Ginkgo) |
  | **E2E Tests (Upstream)** | KubeVirt Ginkgo e2e tests for NAD live update scenarios | Dev + QE | Go (Ginkgo) |
  | **Integration Tests (Downstream)** | CNV product-level integration tests | QE | **Python (pytest)** in `openshift-virtualization-tests` |
  | **System Tests** | Full cluster-level tests with HCO, OCP, real network backends | QE | **Python (pytest)** in `openshift-virtualization-tests` |
  | **Regression Tests** | Ensure existing hotplug/unplug, migration, and network flows are not broken | QE | **Python (pytest)** in `openshift-virtualization-tests` |

  ### 3.2 Test Types

  | Type | Purpose |
  |---|---|
  | **Functional** | Core feature functionality per acceptance criteria |
  | **Negative** | Invalid inputs, missing NADs, unsupported bindings, FG disabled |
  | **Boundary** | Multiple simultaneous NAD changes, rapid successive changes, concurrent operations |
  | **Compatibility** | DNC clusters, different OCP versions, different CNI plugins |
  | **Regression** | Existing network hotplug, migration, and VM lifecycle flows |
  | **Upgrade** | Feature behavior across CNV upgrades (FG persistence, rollback) |
  | **Scale / Stress** | Many VMs, rapid successive changes |

  ### 3.3 Test Approach

  1. **Feature Gate Gating**: All positive tests run with `LiveUpdateNADRef` FG enabled. Selected tests verify gating behavior (FG disabled results in RestartRequired).
  2. **Migration Verification**: Tests verify that NAD changes trigger Live Migration (not restart) and that migration completes successfully.
  3. **Post-Migration Validation**: After migration, verify the target pod's multus annotation, network connectivity, guest interface preservation (MAC, interface name), and VM/VMI health.
  4. **Combination Testing**: Test scenarios where NAD ref changes are combined with other VM spec changes.

  ### 3.4 Test Development Workflow

  Following the `openshift-virtualization-tests` [two-phase workflow](docs/SOFTWARE_TEST_DESCRIPTION.md):

  | Phase | Deliverable | Description |
  |---|---|---|
  | **Phase 1: STD PR** | Test stubs with docstrings | Python test functions with `Preconditions/Steps/Expected` docstrings, `__test__ = False`. Reviewed for test design completeness. |
  | **Phase 2: Automation PR** | Test implementation | Actual pytest code, fixtures, assertions. `__test__ = False` removed. Reviewed for correctness. |

  ### 3.5 Pytest Markers

  | Marker | Applied To |
  |---|---|
  | `network` | All test cases (component marker) |
  | `ipv4` | Tests verifying L2 connectivity via ping |
  | `gating` | P1 critical tests in CI gating job |
  | `tier3` | Complex/time-consuming tests (scale, stress, race conditions) |
  | `sriov` | TC-14 (non-bridge binding test requiring SR-IOV hardware) |
  | `polarion("CNV-XXXXX")` | All tests (Polarion traceability -- IDs assigned during Phase 2) |

