        - "Swapping PVC -> DataVolume exposes DataVolume content in the guest"
    specific_preconditions:
      - requirement: "Running VM with a DataVolume-backed CD-ROM injected"
      - requirement: "A PVC-backed media source available for the swap"
    test_steps:
      setup: "Start a VM with a DataVolume-backed CD-ROM and prepare a PVC media source."
      test_execution:
        - step: 1
          action: "Swap the CD-ROM volume reference from the DataVolume to the PVC in the VM spec"
        - step: 2
          action: "Swap the CD-ROM volume reference back from the PVC to a DataVolume"
    assertions:
      - description: "Each swap exposes the corresponding source content in the guest without restart"
    priority_comment: "P1 — cross-volume-type swap; single-type swap already covered as P0"

  - test_id: "TS-CNV-68916-010"
    requirement_id: "REQ-CDROM-SWAP-03"
    requirement_summary: "CD-ROM swap preserves VM operation without restart"
    tier: "Tier 1"
    priority: "P0"
    coverage_status: "NEW"
    test_objective:
