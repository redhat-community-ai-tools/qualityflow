    assertions:
      - description: "The volume change takes effect only after the VM restart when both gates are disabled"
    priority_comment: "P2 — edge combination of gate states"

  - test_id: "TS-CNV-68916-017"
    requirement_id: "REQ-RESTART-01"
    requirement_summary: "Removing CD-ROM disk from VM spec triggers RestartRequired"
    tier: "Tier 1"
    priority: "P0"
    coverage_status: "NEW"
    test_objective:
