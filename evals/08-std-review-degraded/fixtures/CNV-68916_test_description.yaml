  - test_id: "TS-CNV-68916-019"
    requirement_id: "REQ-RESTART-03"
    requirement_summary: "CD-ROM disk removal takes effect after restart"
    tier: "Tier 1"
    priority: "P1"
    coverage_status: "NEW"
    test_objective:
