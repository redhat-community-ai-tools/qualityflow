        - step: 2
          action: "Wait for the VMI to reflect the swapped volume and re-read the CD-ROM in the guest"
    assertions:
      - description: "The guest reads media B content and media A content is no longer present"
    priority_comment: "P0 — swap is a primary GA operation for the feature"

  - test_id: "TS-CNV-68916-009"
    requirement_id: "REQ-CDROM-SWAP-02"
    requirement_summary: "CD-ROM swap between different volume types"
    tier: "Tier 1"
    priority: "P1"
    coverage_status: "NEW"
    test_objective:
      title: "Swap CD-ROM media from a DataVolume source to a PVC source and vice versa"
      acceptance_criteria:
