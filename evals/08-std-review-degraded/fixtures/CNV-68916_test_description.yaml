    specific_preconditions:
      - requirement: "Running VM with media A injected and a workload/heartbeat observable in the guest"
      - requirement: "A distinct media B source available for the swap"
    test_steps:
      setup: "Start a VM with media A injected and begin observing continuous guest availability."
      test_execution:
        - step: 1
          action: "Swap the CD-ROM volume reference from media A to media B in the VM spec"
