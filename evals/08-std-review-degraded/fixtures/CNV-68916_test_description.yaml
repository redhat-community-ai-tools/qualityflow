# Software Test Description (STD) — QualityFlow
# Generated from the approved STP for CNV-68916.
# This is an internal specification format. Test stubs (PSE) are generated
# under outputs/CNV-68916/std/python-tests/.

version: "2.1"

document_metadata:
  jira_id: "CNV-68916"
  feature: "GA: Eject/Inject CD-ROM Support via Declarative Hotplug Volumes"
  generated_by: "QualityFlow"
  project_id: "cnv"
  display_name: "OpenShift Virtualization (CNV)"
  owning_sig: "sig-storage"
  participating_sigs: ["sig-compute", "sig-network"]
  enhancement: "https://github.com/kubevirt/enhancements/issues/31"
  fix_versions: ["OCP 4.18+", "CNV 4.22+"]
  status: "GA (off by default; fully-supported when enabled)"
  stp_reference:
    file: "outputs/CNV-68916/stp/CNV-68916_test_plan.md"
    url: null
  api_extensions: true
  known_limitations:
    - "Ephemeral hotplug volumes are not supported when DeclarativeHotplugVolumes is enabled; if both DeclarativeHotplugVolumes and HotplugVolumes are enabled, HotplugVolumes takes precedence."
    - "SATA CD-ROM drives cannot be hot-detached; removing a CD-ROM disk entry from the VM spec triggers RestartRequired instead of live removal."
    - "PCI address stability across upgrades is an open concern (upstream kubevirt/kubevirt#17029 not yet merged)."
    - "Feature is GA but off by default; the DeclarativeHotplugVolumes feature gate must be explicitly enabled (tracked in CNV-79690)."
    - "VM must be running for hotplug operations to take effect on the VMI."
    - "Volume ordering changes do not trigger RestartRequired (PR #15788)."

# Test framework/language resolved in AUTO mode from the repository under test
# (RedHatQE/openshift-virtualization-tests — Python/pytest suite).
code_generation_config:
  language: "python"
  framework: "pytest"
  package_convention: "external"
  test_file_pattern: "test_*.py"
  source_repo: "RedHatQE/openshift-virtualization-tests"
  build_command: "uv run pytest"
  notes: >
    Repository under test is the downstream Python QE suite; all scenarios are
    generated as pytest stubs. Upstream Tier 1 coverage in kubevirt Ginkgo v2
    tests (tests/storage/declarative-hotplug.go) is referenced for context but
    downstream stubs are Python. polarion feature toggle is false, so only
    @pytest.mark.qf_test_id markers are emitted.

# Shared infrastructure assumed by all scenarios (from STP Section II.3).
common_preconditions:
  environment:
    - "Standard HA cluster (3 control-plane + 2 worker nodes minimum) with hardware virtualization enabled"
    - "OCP 4.18+ with OpenShift Virtualization (CNV) 4.22+ installed"
    - "CDI operator deployed and functional for DataVolume creation"
    - "At least one StorageClass with dynamic provisioning and ReadWriteOnce support"
  feature_gate:
    - "DeclarativeHotplugVolumes feature gate enabled via HyperConverged CR (spec.featureGates.declarativeHotplugVolumes: true), unless a scenario explicitly tests the gate-disabled path"
  tooling:
    - "virtctl, oc, and kubectl available on the test runner"

scenarios:
  - test_id: "TS-CNV-68916-001"
    requirement_id: "REQ-CDROM-INJECT-01"
    requirement_summary: "CD-ROM can be injected into a running VM via declarative hotplug"
    tier: "Tier 1"
    priority: "P0"
    coverage_status: "NEW"
    test_objective:
      title: "CD-ROM inject with a DataVolume source on a running VM with an empty CD-ROM disk"
      acceptance_criteria:
        - "The injected volume appears in the VMI volumeStatus as ready"
        - "The CD-ROM is mountable and readable inside the guest"
    specific_preconditions:
      - requirement: "Running VM with an empty CD-ROM disk (disk defined without a volume reference)"
      - requirement: "A bootable/readable DataVolume available to serve as CD-ROM media"
    test_steps:
      setup: "Start a VM containing an empty CD-ROM disk and provision a source DataVolume."
      test_execution:
        - step: 1
          action: "Add a volume reference for the DataVolume to the empty CD-ROM disk in the VM spec"
        - step: 2
          action: "Wait for the VM controller to reconcile the change to the running VMI"
    assertions:
      - description: "The DataVolume appears in the VMI volumeStatus with a ready phase"
      - description: "The CD-ROM device is mountable and its contents are readable inside the guest"
    priority_comment: "P0 — core inject operation is the primary user story of the feature"

  - test_id: "TS-CNV-68916-002"
    requirement_id: "REQ-CDROM-INJECT-02"
    requirement_summary: "CD-ROM inject works with PVC volume source"
    tier: "Tier 1"
    priority: "P1"
    coverage_status: "NEW"
    test_objective:
      title: "CD-ROM inject with a PVC source on a running VM"
      acceptance_criteria:
        - "CD-ROM content backed by the PVC is accessible inside the guest"
    specific_preconditions:
      - requirement: "Running VM with an empty CD-ROM disk"
      - requirement: "A pre-populated PVC available as CD-ROM media"
    test_steps:
      setup: "Start a VM with an empty CD-ROM disk and prepare a PVC with readable content."
      test_execution:
        - step: 1
          action: "Add a volume reference for the PVC to the empty CD-ROM disk in the VM spec"
        - step: 2
          action: "Wait for the VMI to reflect the injected volume"
    assertions:
      - description: "The PVC-backed CD-ROM content is accessible and readable inside the guest"
    priority_comment: "P1 — alternate volume source; DataVolume path already covers the P0 flow"

  - test_id: "TS-CNV-68916-003"
    requirement_id: "REQ-CDROM-INJECT-03"
    requirement_summary: "Injected CD-ROM reflects correct content in guest"
    tier: "Tier 1"
    priority: "P0"
    coverage_status: "NEW"
    test_objective:
      title: "Injected CD-ROM shows expected file count and content in the guest OS"
      acceptance_criteria:
        - "The injected CD-ROM is mountable and readable"
        - "The guest sees the expected file count and file content"
    specific_preconditions:
      - requirement: "Running VM with an empty CD-ROM disk"
      - requirement: "A source volume whose expected file listing and content are known in advance"
    test_steps:
      setup: "Start a VM with an empty CD-ROM disk and record the expected file count/content of the source media."
      test_execution:
        - step: 1
          action: "Inject the source volume into the empty CD-ROM disk in the VM spec"
        - step: 2
          action: "Mount the CD-ROM inside the guest and list its contents"
    assertions:
      - description: "The mounted CD-ROM inside the guest reports the expected file count and file content"
    priority_comment: "P0 — verifies data correctness of the injected media, not just attachment"

  - test_id: "TS-CNV-68916-004"
    requirement_id: "REQ-CDROM-INJECT-04"
    requirement_summary: "CD-ROM inject fails gracefully when feature gate is disabled"
    tier: "Tier 1"
    priority: "P1"
    coverage_status: "NEW"
    test_objective:
      title: "Adding a CD-ROM volume with the feature gate disabled does not hot-inject"
      acceptance_criteria:
        - "The volume change is not applied to the running VMI"
        - "The change is queued and requires a restart to take effect"
    specific_preconditions:
      - requirement: "DeclarativeHotplugVolumes feature gate disabled"
      - requirement: "Running VM with an empty CD-ROM disk"
    test_steps:
      setup: "Ensure the DeclarativeHotplugVolumes gate is disabled and start a VM with an empty CD-ROM disk."
      test_execution:
        - step: 1
          action: "Add a volume reference to the empty CD-ROM disk in the VM spec"
        - step: 2
          action: "Wait to confirm the running VMI is not updated with the new volume"
    assertions:
      - description: "The volume is not hot-injected into the running VMI and the change is deferred to next restart"
    priority_comment: "P1 — negative gate-disabled behavior guards against unintended hotplug"

  - test_id: "TS-CNV-68916-005"
    requirement_id: "REQ-CDROM-EJECT-01"
    requirement_summary: "CD-ROM can be ejected from a running VM by removing volume reference"
    tier: "Tier 1"
    priority: "P0"
    coverage_status: "NEW"
    test_objective:
      title: "CD-ROM eject by removing the volume reference while keeping the disk entry"
      acceptance_criteria:
        - "The volume is unplugged from the running VMI"
        - "The guest reports 'No medium found' for the empty CD-ROM drive"
    specific_preconditions:
      - requirement: "Running VM with a CD-ROM disk that currently has an injected volume"
    test_steps:
      setup: "Start a VM with a CD-ROM disk that already has media injected."
      test_execution:
        - step: 1
          action: "Remove the volume reference from the CD-ROM disk in the VM spec, keeping the disk entry"
        - step: 2
          action: "Wait for the VM controller to unplug the volume from the running VMI"
    assertions:
      - description: "The volume is removed from the VMI volumeStatus and the guest reports 'No medium found' on the drive"
    priority_comment: "P0 — core eject operation of the feature"

  - test_id: "TS-CNV-68916-006"
    requirement_id: "REQ-CDROM-EJECT-02"
    requirement_summary: "Ejected CD-ROM drive remains as empty device in guest"
    tier: "Tier 1"
    priority: "P1"
    coverage_status: "NEW"
    test_objective:
      title: "After eject, the /dev/sr0 device still exists but reports 'No medium found'"
      acceptance_criteria:
        - "The /dev/sr0 device remains present in the guest"
        - "Mounting the empty drive returns 'No medium found'"
    specific_preconditions:
      - requirement: "Running VM whose CD-ROM media has just been ejected (empty CD-ROM drive)"
    test_steps:
      setup: "Start a VM with injected CD-ROM media, then eject the media by removing the volume reference."
      test_execution:
        - step: 1
          action: "Inside the guest, check for the presence of the /dev/sr0 device"
        - step: 2
          action: "Attempt to mount /dev/sr0 in the guest"
    assertions:
      - description: "/dev/sr0 still exists in the guest and the mount attempt returns 'No medium found'"
    priority_comment: "P1 — confirms the empty-drive end state after eject"

  - test_id: "TS-CNV-68916-007"
    requirement_id: "REQ-CDROM-EJECT-03"
    requirement_summary: "CD-ROM eject fails gracefully when feature gate is disabled"
    tier: "Tier 1"
    priority: "P1"
    coverage_status: "NEW"
    test_objective:
