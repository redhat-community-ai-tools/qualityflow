        - "The eject is queued for the next restart"
    specific_preconditions:
      - requirement: "DeclarativeHotplugVolumes feature gate disabled"
      - requirement: "Running VM with an injected CD-ROM volume"
    test_steps:
      setup: "Disable the DeclarativeHotplugVolumes gate and start a VM with injected CD-ROM media."
      test_execution:
        - step: 1
          action: "Remove the volume reference from the CD-ROM disk in the VM spec"
        - step: 2
          action: "Wait to confirm the running VMI still has the volume attached"
    assertions:
      - description: "The CD-ROM volume is not hot-ejected and the change is deferred to next restart"
    priority_comment: "P1 — negative gate-disabled behavior for eject"

  - test_id: "TS-CNV-68916-008"
    requirement_id: "REQ-CDROM-SWAP-01"
    requirement_summary: "CD-ROM media can be swapped on a running VM without restart"
    tier: "Tier 1"
    priority: "P0"
    coverage_status: "NEW"
    test_objective:
