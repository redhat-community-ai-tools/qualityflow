        - step: 2
          action: "Observe which reconciliation path (legacy vs declarative) handles the change"
    assertions:
      - description: "The legacy HotplugVolumes behavior takes precedence when both gates are enabled"
    priority_comment: "P1 — backward-compatibility precedence rule"

  - test_id: "TS-CNV-68916-016"
    requirement_id: "REQ-FGATE-04"
    requirement_summary: "Both feature gates disabled"
    tier: "Tier 1"
    priority: "P2"
    coverage_status: "NEW"
    test_objective:
