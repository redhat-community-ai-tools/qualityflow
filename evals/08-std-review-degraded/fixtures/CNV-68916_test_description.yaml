    assertions:
      - description: "All three operations are hot-applied to the running VMI while the gate is enabled"
    priority_comment: "P0 — validates the primary gating mechanism for the feature"

  - test_id: "TS-CNV-68916-014"
    requirement_id: "REQ-FGATE-02"
    requirement_summary: "CD-ROM hotplug blocked when feature gate is disabled"
    tier: "Tier 1"
