# Eval case: Error case — STP with critical violations produces NEEDS_REVISION
name: stp-reviewer-error-critical
skill: stp-reviewer
type: error-case
description: >
  An STP with multiple critical violations: missing requirement coverage (only
  1 of 4 acceptance criteria covered), generic scenario text, internal mechanism
  language in scope, and a prerequisite masquerading as a test scenario. Expects
  NEEDS_REVISION with specific critical findings.

input:
  stp_file: |
    # STP: DEMO-300 — Cache Invalidation Quality Engineering Plan

    ## Section I: Motivation & Requirements Review

    ### I.1 Requirements Review
    - [x] Review Requirements
      - Reviewed DEMO-300 for cache invalidation feature
    - [x] Understand Value and Customer Use Cases
      - As a user, I want cached data to refresh when underlying data changes
    - [x] Testability
      - Cache state observable via debug API endpoint
    - [x] Acceptance Criteria
      - 4 acceptance criteria from DEMO-300
    - [ ] NFRs

    ### I.2 Known Limitations
    (none)

    ### I.3 Technology Review
    - [x] Developer Handoff
      - Kickoff should be scheduled after PR is merged
    - [ ] Technology Challenges
    - [x] API Extensions
      - Cache invalidation triggered via internal reconciler webhook
    - [ ] Test Environment Needs
    - [ ] Topology

    ## Section II: Software Test Plan

    ### II.1 Scope
    #### Scope of Testing
    - [x] Cache reconciler processes invalidation events correctly
    - [x] Cache sync propagates to all replica nodes
    - [x] TTL-based eviction triggers without the service noticing

    #### Out of Scope
    - [x] Performance benchmarking

    #### Testing Goals
    - Verify the cache reconciler correctly invalidates stale entries
    - Verify cache sync protocol succeeds across replicas

    ### II.2 Test Strategy
    - [x] Functional Testing
      - Cache invalidation verification
    - [x] Automation Testing
      - Automated via QualityFlow
    - [ ] Performance Testing
    - [ ] Security Testing
    - [ ] Usability Testing
    - [x] Upgrade Testing
      - Cache entries must survive upgrade
    - [ ] Monitoring Testing
    - [ ] Regression Testing
    - [ ] Dependencies

    ### II.3 Test Environment
    - Multi-node cluster with cache service deployed

    ### II.4 Entry / Exit Criteria
    - Entry: Cache service deployed
    - Exit: Tests pass

    ### II.5 Risks
    - [x] Multi-node cluster required for cache sync testing
      - Mitigation: Use 3-node staging cluster

    ## Section III: Test Scenarios & Traceability

    - **[DEMO-300]** — Cache invalidation
      - Cache service must be deployed and running on all nodes — Tier 1 — P0
      - Verify feature works correctly — Tier 1, Tier 2 — P0
      - Verify the reconciler triggers invalidation when data changes — Tier 1 — P1

    ## Section IV: Sign-off & Approval
    - Reviewer: TBD
    - Approver: TBD

  jira_data:
    main_issue:
      key: DEMO-300
      summary: "Cache invalidation when underlying data changes"
      description: "Implement automatic cache invalidation so users see fresh data"
      acceptance_criteria:
        - "Cached data refreshes within 5 seconds of source change"
        - "Cache invalidation works across all replica nodes"
        - "User sees updated data without manual cache clear"
        - "Cache invalidation does not cause request failures during refresh"
      issue_type: Story
      priority: Critical
      status: In Progress
    linked_issues: []

expected:
  verdict: NEEDS_REVISION
  assertions:
    - critical_findings: ">= 3"
    - findings_include:
        # Rule A: internal mechanism language in scope — "reconciler", "sync protocol"
        - rule: "A"
          severity: CRITICAL
          pattern: "internal mechanism in scope"
        # Rule C: prerequisite as scenario — "Cache service must be deployed"
        - rule: "C"
          severity: CRITICAL
          pattern: "prerequisite as test scenario"
        # Rule J: multiple tiers in one row — "Tier 1, Tier 2"
        - rule: "J"
          severity: CRITICAL
          pattern: "multiple tiers in same row"
        # Dimension 2: only 1/4 acceptance criteria covered
        - dimension: 2
          severity: CRITICAL
          pattern: "coverage below threshold"
        # Dimension 3: generic scenario — "Verify feature works correctly"
        - dimension: 3
          severity: CRITICAL
          pattern: "generic scenario"
        # Rule I: kickoff timing — "after PR is merged"
        - rule: "I"
          severity: MAJOR
          pattern: "kickoff after implementation"
        # Rule A: anthropomorphization — "without the service noticing"
        - rule: "A.2"
          severity: MAJOR
          pattern: "anthropomorphizing infrastructure"
