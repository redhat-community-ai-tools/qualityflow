# Jira instance configuration.
# Used by the jira-parser skill to fetch and parse issue data.

instance:
  url: "https://your-org.atlassian.net"
  browse_pattern: "https://your-org.atlassian.net/browse/{key}"

# Jira project prefixes that route to this QualityFlow project
prefixes:
  - "MYPROJ"

# Optional: custom field mappings
# custom_fields:
#   feature_link: "Feature Link"
#   git_pull_request: "Git Pull Request"

pr_url_scan_pattern: "https://github.com/.*/pull/\\d+"
