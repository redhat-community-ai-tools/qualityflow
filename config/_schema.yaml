# QualityFlow Project Configuration Schema
# Defines validation rules and documentation for project config files
version: "1.0"

# Each project directory MUST contain these files
required_files:
  - project.yaml        # Core identity + feature toggles
  - repositories.yaml   # Repository configuration
  - components.yaml     # Component-to-package mappings
  - jira.yaml           # Jira instance configuration
  - environment.yaml    # Platform requirements
  - pii_exceptions.yaml # PII allowlist

# These files are OPTIONAL (presence controlled by feature toggles)
optional_files:
  - "tier*.yaml"         # One per tier (e.g., tier1.yaml, tier2.yaml, tier3.yaml). Required when test_strategy == "tier"
  - review_rules.yaml    # Project-specific review rules (optional override; auto-extracted from config files by review-rules-extractor when absent)

# Optional directories
optional_directories:
  - patterns/            # Project-specific pattern rules
  - reference/           # Project-specific reference test files
  - templates/           # Project-specific code/document templates

# Validation rules
validation:
  project_yaml:
    required_fields:
      - project_id
      - display_name
    optional_fields:
      - description
      - feature_toggles        # includes test_strategy: "auto" (default) or "tier"
      - versioning
      - stp_document
      - sig_mappings
      - decorator_mappings
      - scope_boundaries

  repositories_yaml:
    required_fields:
      - primary_repo
      - primary_repo.name
      - primary_repo.org
    optional_fields:
      - design_docs_repo
      - repo_files

  components_yaml:
    required_fields:
      - component_package_map

  jira_yaml:
    required_fields:
      - instance
      - prefixes

  # Generic tier config validation — applies to all tier*.yaml files
  tier_yaml:
    required_fields:
      - enabled
      - tier
      - language
      - framework
    optional_fields:
      - display_name
      - description
      - reference_guide
      - reference_tests

  review_rules_yaml:
    required_fields:
      - project_id
    optional_sections:
      - stp_rules
      - std_rules

# Feature toggle consistency rules
# These rules only apply when test_strategy is "tier" (or absent with tier config present).
# In "auto" mode, tier1.yaml/tier2.yaml are not required — test conventions are detected from the repo.
# When test_strategy is "tier", at least one tier*.yaml must exist
tier_consistency:
  condition: "test_strategy == 'tier'"
  requires_glob: "tier*.yaml"
  error: "test_strategy is 'tier' but no tier*.yaml files found. Create at least one (see tier.yaml.example)"
