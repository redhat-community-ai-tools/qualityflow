name: Publish image

# Build the dashboard container and push it to GHCR so teams can `helm install`
# straight from the chart. Fires on a version tag (v1.2.3) and can be run
# by hand against any branch via the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/qualityflow-dashboard

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR with the built-in GITHUB_TOKEN, no extra secret
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag = v1.2.3 -> {1.2.3, 1.2, latest}; manual run -> {<branch>, sha-<short>}.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          # ponytail: amd64 only — OpenShift/k8s nodes are overwhelmingly x86.
          # Add linux/arm64 (needs QEMU setup) when someone runs on arm nodes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QF_COMMIT=${{ github.sha }}
