name: Eval Smoke

# Cheap structural gate for the stp-reviewer eval suite: no model runs, no LLM
# judges, no secrets. The full eval remains a manual harness run (eval/README.md).
on:
  pull_request:
    paths:
      - "eval/**"
      - "skills/stp-reviewer/**"
      - "scripts/eval_smoke.py"
      - "scripts/lint_traceability.py"
      - ".github/workflows/eval-smoke.yml"
      # lint_traceability.py checks STD scenarios for requirement_ids /
      # stp_scenario_id. Without these, a change on the producing side (the
      # generator) never triggers the lint that exists to catch it.
      - "skills/std-generator/**"
      - "skills/std-orchestrator/**"
      - "skills/std-reviewer/**"
      - "skills/scenario-builder/**"
      - "commands/std-builder.md"
      - "tests/**/*_test_description.yaml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Eval suite smoke checks (structure + deterministic judges)
        run: python3 scripts/eval_smoke.py
      - name: STD traceability lint (QE-03)
        run: python3 scripts/lint_traceability.py
