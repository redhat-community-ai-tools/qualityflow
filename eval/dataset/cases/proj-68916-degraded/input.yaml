  #### **5. Risks**

  | Risk Category        | Specific Risk for This Feature | Mitigation Strategy | Status |
  |:---------------------|:-------------------------------|:--------------------|:-------|
  | Timeline/Schedule    | Feature is GA but off by default; may delay full rollout until telemetry confirms safety | Track PROJ-79690 (Declarative Hot-attach on by default) for timeline alignment | [ ] |
  | Test Coverage        | Upstream test flakiness in declarative hot-attach path (volume detach ordering race conditions) | Monitor PR #14998 fix in CI; quarantine and investigate any remaining flakes | [ ] |
  | Test Environment     | Storage backend variability may mask issues | Test with at least two storage backends (network block storage and local-path-provisioner) | [ ] |
  | Untestable Aspects   | PCI address stability across upgrades (PR #17029 still in progress) | Monitor upstream PR progress; add upgrade-specific PCI address tests when fix is available | [ ] |
  | Resource Constraints | Multiple workloads and volume claims needed for hot-attach testing consume significant cluster resources | Pre-provision volume claims to reduce test setup time; use small test workload images where possible | [ ] |
  | Dependencies         | The volume importer must be functional for volume-claim-based tests | Include volume importer health check as test precondition; have PVC-based fallback tests | [ ] |
  | Other                | Interaction between HotAttachVolumes and DeclarativeHotAttachVolumes feature gates creates four state combinations | Test all four combinations of feature gate states (both on, both off, each independently) | [ ] |

  #### **6. Known Limitations**

  - **Ephemeral hot-attach volumes are not supported** when `DeclarativeHotAttachVolumes` is enabled. If both `DeclarativeHotAttachVolumes` and `HotAttachVolumes` are enabled, `HotAttachVolumes` takes precedence to maintain backward compatibility. Ephemeral volumes in a workload instance that are not present in the owner workload spec are automatically removed by the workload controller.
  - **SATA media drives cannot be hot-detached** from a running workload. Removing a media drive entry from the workload spec triggers a `RestartRequired` condition instead of attempting a live removal (which would cause a device runtime error). The media can be ejected without restart, but the drive itself requires a restart to be removed.
  - **PCI address stability across upgrades** is an open concern. Upstream PR my-org/example-platform#17029 is addressing this with a v3 hot-attach port topology, but it has not yet merged.
  - **Feature is GA but off by default.** The `DeclarativeHotAttachVolumes` feature gate must be explicitly enabled. It will remain off by default until telemetry confirms safety for broad enablement (tracked in PROJ-79690).
  - **Workload must be running** for hot-attach operations to take effect on the workload instance. Changes to a stopped workload spec are applied on next boot without requiring the feature gate.
  - **Volume ordering changes do not trigger RestartRequired.** Adding a hot-attach volume at any position in the volumes list (beginning, end) should not produce a RestartRequired condition (PR #15788 fix).

