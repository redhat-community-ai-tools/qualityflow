  # My-tests Test plan

  ## **GA: Eject/Insert Removable Media Support via Declarative Hot-attach Volumes - Quality Engineering Plan**

  ### **Metadata & Tracking**

  | Field                  | Details                                                           |
  |:-----------------------|:------------------------------------------------------------------|
  | **Enhancement(s)**     | [my-org/enhancements#31](https://github.com/my-org/enhancements/issues/31) |
  | **Feature in Jira**    | [PROJ-68916](https://your-jira-instance.example.com/browse/PROJ-68916)           |
  | **Jira Tracking**      | [PROJ-68916](https://your-jira-instance.example.com/browse/PROJ-68916) (Epic), [PROJ-79690](https://your-jira-instance.example.com/browse/PROJ-79690) (Declarative Hot-attach on by default), [PROJ-77383](https://your-jira-instance.example.com/browse/PROJ-77383) (UI: GA: Eject/Insert Removable Media Support), [PROJ-64402](https://your-jira-instance.example.com/browse/PROJ-64402) (GA: Adopt declarative hot-attach volumes API) |
  | **QE Owner(s)**        | [QE Owner]                                                            |
  | **Owning SIG**         | storage team                                                      |
  | **Participating SIGs** | compute team, network team                                        |
  | **Current Status**     | GA (off by default; fully-supported when enabled)                 |

  **Document Conventions (if applicable):** This STP covers the GA promotion of the Eject/Insert Removable Media feature via declarative hot-attach volumes. The feature is GA but remains off by default until telemetry confirms safety for broad enablement (per PROJ-79690). Ephemeral hot-attach volumes are not supported when the `DeclarativeHotAttachVolumes` feature gate is enabled. The `--persist` flag in exampctl is deprecated; persist-by-default is the new behavior.

  ### **Feature Overview**

  The Eject/Insert Removable Media Support feature allows workload owners to change removable media on a running workload without requiring a restart. It is implemented via the `DeclarativeHotAttachVolumes` feature gate, which replaces the imperative sub-resource based hot-attach API with a declarative approach where volume changes are made directly in the workload spec and automatically propagated to the running workload instance.

  Key capabilities:

  - **Media Insert:** Attach a media volume (volume claim, PVC) to a running workload by adding a volume reference to the workload spec for an existing empty media drive
  - **Media Eject:** Remove a media volume from a running workload by removing the volume reference from the workload spec; the empty media drive remains in the workload OS
  - **Media Swap:** Replace the media source by updating the volume reference (e.g., changing the volume claim name) in the workload spec
  - **Empty Media Drive Support:** Workloads can be created with an empty media drive (disk defined without a volume reference); the workload OS sees a drive with "No medium found"
  - **Declarative Volume Hot-attach:** Volume changes are persisted in the workload spec (GitOps-friendly), replacing the ephemeral workload instance sub-resource API
  - **NVMe Bus Support:** Hot-attached disks can now use the NVMe bus in addition to SCSI and SATA (PR [#14907](https://github.com/my-org/example-platform/pull/14907))
  - **PCI Port Allocation:** Automatic allocation of PCI ports for hot-attach capacity: 8 ports (at least 3 free) for workloads with 2G or less memory, 16 ports (at least 6 free) for workloads with more than 2G memory (PR [#14754](https://github.com/my-org/example-platform/pull/14754))
  - **RestartRequired Condition:** Removing a media drive entry from the workload spec triggers RestartRequired instead of attempting a live SATA detach, which would fail at the device runtime level (PR [#15969](https://github.com/my-org/example-platform/pull/15969))
  - **exampctl Persist-by-Default:** `exampctl addvolume` and `exampctl removevolume` now persist changes to the workload spec by default; the `--persist` flag is deprecated (PR [#16280](https://github.com/my-org/example-platform/pull/16280))
  - **Ephemeral Hot-attach Volume Metric:** New `example_instance_contains_ephemeral_hot_attach_volume` metric and alert to identify workload instances with ephemeral hot-attach volumes ahead of `HotAttachVolumes` deprecation (PR [#15815](https://github.com/my-org/example-platform/pull/15815))

