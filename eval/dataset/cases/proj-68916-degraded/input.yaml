  ### **II. Software Test Plan (STP)**

  This STP serves as the **overall roadmap for testing**, detailing the scope, approach, resources, and schedule.

  #### **1. Scope of Testing**

  This test plan covers the GA validation of the Removable Media Eject/Insert feature via declarative hot-attach volumes in Example Platform. Testing scope includes the core media operations (insert, eject, swap), empty media drive support, declarative volume hot-attach behavior, feature gate interactions, bus type support (SATA, NVMe), the workload controller reconciler sync loop that propagates hot-attach volume status annotations onto the workload instance object, the workload instance mutating webhook trigger path, PCI port allocation, RestartRequired condition handling, exampctl persist-by-default behavior, ephemeral hot-attach restriction, monitoring (metric and alert), RBAC enforcement, integration with existing features (relocation, snapshots, restore), and regression coverage for areas impacted by the code changes.

  **Testing Goals**

  - Validate media insert, eject, and swap operations on running workloads without restart
  - Verify the workload controller reconciler syncs the hot-attach volume status annotation from the workload spec onto the workload instance object and re-triggers the volume propagation loop
  - Confirm empty media drive can be defined in workload spec and reports "No medium found" in the workload OS
  - Confirm RestartRequired condition is set when media drive entries are removed from workload spec
  - Validate feature gate behavior (DeclarativeHotAttachVolumes enable/disable, interaction with HotAttachVolumes)
  - Verify NVMe bus support for hot-attached disks alongside existing SATA/SCSI support
  - Validate the PCI port allocator's internal free-port bookkeeping and the hot-attach-status annotation the controller writes back after each reconcile pass
  - Verify exampctl addvolume/removevolume persist-by-default behavior and --persist flag deprecation
  - Confirm ephemeral hot-attach volume restriction and associated monitoring metric/alert
  - Validate no regressions in existing hot-attach, relocation, snapshot, and restore workflows
  - Validate error handling for invalid operations (e.g., operations with feature gate disabled, unsupported bus types)
  - Verify RBAC enforcement for workload spec volume modifications

  **Out of Scope (Testing Scope Exclusions)**

  | Out-of-Scope Item | Rationale | PM/ Lead Agreement |
  |:-------------------|:----------|:-------------------|
  | UI testing of media eject/insert | Covered by separate epic PROJ-77383 with dedicated QE ([UI QE Owner]) | Agreed |
  | Kubernetes storage provisioner internals | Platform-level testing; CSI driver validation is the responsibility of the storage team | Agreed |
  | Device runtime media drive emulation | Upstream component; validated by device runtime upstream testing | Agreed |
  | Multi-cluster federation scenarios | Feature operates within single-cluster scope; no federation requirements | Agreed |
  | Performance benchmarking of hot-attach latency | Not a GA requirement; may be pursued separately if needed | Agreed |

