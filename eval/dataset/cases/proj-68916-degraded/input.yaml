  | REQ-PCI-02 | Workloads with more than 2G memory get 16 PCI ports | Verify a workload configured with more than 2G memory has 16 total PCI ports allocated for hot-attach; at least 6 ports are free for use | Tier 1 | P1 |
  | REQ-PCI-03 | Hot-attach operations respect PCI port limits | Verify that hot-attaching volumes up to the free port limit succeeds; verify appropriate error when exceeding available ports | Tier 1 | P2 |
  | REQ-ATTACH-DISK-01 | Non-media disk can be hot-attached declaratively | Verify adding a hot-attach disk (not a media drive) by updating workload spec; disk appears in workload instance and is usable in workload OS | Tier 1 | P1 |
  | REQ-ATTACH-DISK-02 | Non-media disk can be hot-detached declaratively | Verify removing a hot-attach disk and volume from workload spec; disk is detached from workload instance and inaccessible in workload OS | Tier 1 | P1 |
  | REQ-E2E-LIFECYCLE-01 | Full media insert, swap, and eject lifecycle | Verify complete lifecycle: create workload with empty media drive, insert media, verify content, swap media, verify new content, eject media, verify "No medium found", re-insert and verify again | Tier 1 / Tier 2 | P0 |
  | REQ-E2E-PERSIST-01 | Media hot-attach state persists through workload restart | Verify inserted media volume survives workload stop/start cycle; content remains accessible after restart | Tier 2 | P0 |
  | REQ-E2E-PERSIST-02 | Ejected media state persists after workload restart | Verify that an ejected media drive (empty drive) persists correctly after workload restart; workload OS still sees empty media drive | Tier 2 | P1 |
  | REQ-E2E-RELOCATE-01 | Workload with hot-attached media relocates successfully | Verify workload with inserted media can be live-relocated; media drive remains accessible on target node after relocation | Tier 2 | P1 |
  | REQ-E2E-RELOCATE-02 | Hot-attached disk data accessible after relocation | Verify hot-attached data disk content is intact and accessible after live relocation | Tier 2 | P1 |
  | REQ-E2E-SNAPSHOT-01 | Snapshot of workload with hot-attached volumes | Verify snapshot creation succeeds for a workload with declaratively hot-attached volumes | Tier 2 | P1 |
  | REQ-E2E-SNAPSHOT-02 | Restore of workload with hot-attached volumes | Verify restore from snapshot preserves hot-attached volume configuration and data | Tier 2 | P1 |
  | REQ-E2E-UPGRADE-01 | Feature gate state preserved across upgrade | Verify DeclarativeHotAttachVolumes feature gate configuration survives Kubernetes/Example Platform upgrade | Tier 2 | P1 |
  | REQ-E2E-UPGRADE-02 | Workload with hot-attached volumes operational after upgrade | Verify workload with hot-attached media and disk volumes continues to function correctly after cluster upgrade | Tier 2 | P1 |
  | REQ-RBAC-01 | Non-admin user cannot modify workload volumes without permission | Verify that a user without workload edit permissions cannot add or remove volumes from a workload spec | Tier 1 | P1 |
  | REQ-RBAC-02 | Admin can grant volume management permissions | Verify that a cluster admin can grant a user permission to modify workload volumes via RBAC roles | Tier 1 | P2 |
  | REQ-NEGATIVE-01 | Hot-attach of non-hot-attachable volume is rejected | Verify that attempting to hot-attach a volume without `hotAttachable: true` is rejected or triggers RestartRequired | Tier 1 | P2 |
  | REQ-NEGATIVE-02 | Invalid volume reference is handled gracefully | Verify that referencing a non-existent volume claim or PVC in a media volume update is handled with appropriate error/event | Tier 1 | P2 |

