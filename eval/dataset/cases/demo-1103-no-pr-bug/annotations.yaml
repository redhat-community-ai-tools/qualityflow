  notes: >-
    Fully synthetic: the project, bug ticket and STP were written for this case.
    reference.md derives the expected findings from skills/stp-reviewer/SKILL.md.

# --- exactly what was planted, and nothing else ---
constructed_findings:
  - id: P1
    rule_targeted: "Rule D (Dependencies = Team Delivery)"
    edit: >-
      The Dependencies strategy row is marked Y and lists the CSI snapshot
      provisioner and the cluster's default StorageClass — pre-existing platform
      infrastructure, not another team's delivery.
    effect: "MAJOR per Rule D: infrastructure listed as a dependency."
  - id: P2
    rule_targeted: "Dimension 6 (Test Strategy) — N/A vs Y challenge"
    edit: >-
      Performance Testing is marked Y with only "validate pruning completes
      within an acceptable time" — no SLA or benchmark target.
    effect: "MAJOR per Dimension 6: functional phrasing, should be unchecked."
  - id: P3
    rule_targeted: "Rule A (Requirement Summary format)"
    edit: >-
      Section III Requirement Summaries are plain phrases, not "As a [role]..."
      user-story format.
    effect: "MAJOR per Rule A's Requirement Summary red flag."

