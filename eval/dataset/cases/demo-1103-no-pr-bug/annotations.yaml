case: demo-1103-no-pr-bug
category: edge-case
description: >-
  PR-null degrade-path probe. A Bug ticket with full Jira data but fix_scope
  null: Rule P's activation guard requires both a bug-type ticket AND PR data, so
  the rule must be skipped as "N/A — not a bug ticket or no PR data available"
  rather than evaluated from guesses about the fix. Both acceptance criteria are
  covered in Section III and the STP carries no critical violation, only a small
  planted major/minor tail. A reviewer that invents tier-efficiency findings
  without fix-scope data, or a coverage critical despite full coverage, fails.

# --- what the produced review must match ---
expected_verdict: APPROVED_WITH_FINDINGS
expected_critical_findings: 0
critical_findings_tolerance: 0     # a critical here means an invented finding
expected_major_findings: 3
expected_minor_findings: 1
major_findings_tolerance: 2        # advisory only — no judge gates on this
minor_findings_tolerance: 2        # advisory only — no judge gates on this
expected_confidence: MEDIUM        # Jira data present but template/repo_rules unavailable

critical_tolerance_rationale: >-
  Both Jira acceptance criteria map to Section III scenarios (REQ-DEMO-1103-01
  covers the tie-break criterion, REQ-DEMO-1103-03 the unchanged-behaviour
  criterion), so no Dimension 2 critical exists. No Rule B/C/J/K/N critical
  pattern is present. Rule P must be reported as skipped per its own activation
  guard — evaluating it without fix_scope is the failure this case watches for.
  The verdict judge independently enforces the zero: one critical flips the
  verdict.

# --- provenance ---
source:
  type: synthetic
  jira_id: DEMO-1103
  project: Demo Virtualization (fictional)
  run_date: null                # never run through the pipeline
