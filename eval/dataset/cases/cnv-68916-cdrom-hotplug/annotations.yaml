case: cnv-68916-cdrom-hotplug
category: happy-path
description: >-
  A well-formed, template-conformant STP for a GA storage feature. No critical
  findings, a long tail of major/minor style and classification issues. This is the
  "the reviewer should not panic" end of the suite: a model that starts inventing
