# The STP under review. Synthetic, written for this case. Two CRITICAL violations
# are planted (see annotations.yaml constructed_findings); the rest of the
# document is deliberately ordinary.
stp_content: |
  # Demo Virtualization Test Plan

  ## Snapshot Auto-Retention for VM Disks — Quality Engineering Plan

  | Field               | Details |
  |:--------------------|:--------|
  | **Feature in Jira** | DEMO-1101 |
  | **QE Owner(s)**     | [QE Owner] |
  | **Owning SIG**      | sig-storage |
  | **Current Status**  | Beta (behind the `SnapshotAutoRetention` feature gate) |

  ### I. Motivation and Requirements Review

  #### 1. Requirement & User Story Review Checklist

  - [x] **Review Requirements**
    - Requirements defined in DEMO-1101: per-VM retention count via
      `spec.snapshotRetention.maxCount`, oldest-first pruning, newest successful
      snapshot always kept, unset means disabled.
  - [x] **Understand Value and Customer Use Cases**
    - As a VM owner, I want old disk snapshots pruned automatically so snapshot
      storage does not grow unbounded. Use cases: nightly snapshot schedules,
      storage-quota-constrained namespaces.
  - [x] **Testability**
    - Testable by creating snapshots past the retention count and observing which
      snapshots remain.
  - [x] **Acceptance Criteria**
    - Three criteria from the ticket: oldest-first pruning, newest successful
      snapshot protected, unset maxCount disables retention.
  - [x] **Non-Functional Requirements (NFRs)**
    - Monitoring: pruning events are recorded on the VM. No new metrics. Docs
      tracked in a downstream story.

  #### 2. Known Limitations

  - Retention counts only successful snapshots; failed snapshots are not pruned
    and must be cleaned up manually.
  - Retention is evaluated on snapshot creation, not on a timer.

  #### 3. Technology and Design Review

  - [x] **Developer Handoff / QE Kickoff**
    - Kickoff held during the design phase; design doc reviewed with QE.
  - [x] **Technology Challenges**
    - Pruning order depends on snapshot creation timestamps; clock skew between
      nodes could make ordering ambiguous.
  - [x] **API Extensions**
    - New optional `spec.snapshotRetention.maxCount` field on the VM CRD.
  - [x] **Test Environment Needs**
    - Cluster with the `SnapshotAutoRetention` feature gate enabled and a
      snapshot-capable StorageClass.
  - [x] **Topology Considerations**
    - Single-cluster feature; no multi-cluster impact.

  ### II. Software Test Plan (STP)

  #### 1. Scope of Testing

  Testing covers retention-count configuration on the VM, oldest-first pruning of
  disk snapshots, protection of the most recent successful snapshot, disabled
  behaviour when the count is unset, and validation of invalid retention values.

  **Testing Goals**

  - Validate snapshots beyond the configured retention count are pruned oldest-first
  - Confirm the most recent successful snapshot is never pruned
  - Confirm retention is disabled when `maxCount` is unset
  - Validate invalid retention values are rejected with a clear error

  **Out of Scope (Testing Scope Exclusions)**

  | Out-of-Scope Item | Rationale | PM/ Lead Agreement |
  |:------------------|:----------|:-------------------|
  | CSI snapshot provisioner internals | Platform-level; storage team responsibility | Agreed |
  | UI for retention configuration | No UI ships with this story | Agreed |

  #### 2. Test Strategy

  | Item | Applicable (Y/N or N/A) | Comments |
  |:-----|:------------------------|:---------|
  | Functional Testing | Y | Retention configuration, pruning order, newest-snapshot protection, disabled behaviour |
  | Automation Testing | Y | Automated in the downstream storage test suite |
  | Performance Testing | N/A | No latency or throughput requirement for pruning |
  | Security Testing | N/A | No RBAC or security-boundary change |
  | Regression Testing | Y | Existing snapshot create/restore flows must be unaffected |
  | Upgrade Testing | Y | Retention configuration is persisted in the VM spec and must survive upgrade |
  | Monitoring | N/A | No new metrics or alerts |
  | Dependencies | N/A | No cross-team deliverable required |

  #### 3. Test Environment

  - Cluster with the `SnapshotAutoRetention` feature gate enabled, because the
    retention field is ignored without it
  - A StorageClass with snapshot support, because pruning operates on disk snapshots

  ##### 3.1. Testing Tools & Frameworks

  - None beyond the project's standard test tooling

  #### 4. Entry Criteria

  - [x] Requirements approved and merged
  - [ ] Feature gate available in the target build
  - [ ] Snapshot-capable StorageClass available in the test cluster

  #### 5. Risks

  - [ ] **Untestable Aspects:** Clock-skew-induced ordering ambiguity is hard to
    reproduce on demand. Mitigation: cover the tie-break rule in a unit-level test
    owned by the development team and record the gap here.

  ### III. Test Scenarios & Traceability

  #### 1. Requirements-to-Tests Mapping

  | Requirement ID | Requirement Summary | Test Scenario(s) | Tier | Priority |
  |:---------------|:--------------------|:-----------------|:-----|:---------|
  | REQ-DEMO-1101-01 | Snapshots beyond the retention count are pruned oldest-first | Verify creating maxCount+1 snapshots removes only the oldest snapshot | Tier 1 | P0 |
  | REQ-DEMO-1101-02 | Most recent successful snapshot is never pruned | Verify pruning with maxCount 1 keeps the newest successful snapshot | Tier 1 | P0 |
  | REQ-DEMO-1101-03 | Retention is disabled when maxCount is unset | Verify no snapshots are pruned when maxCount is unset | Tier 1 | P1 |
  | REQ-DEMO-1101-04 | Feature gate is enabled in the test cluster | Verify the SnapshotAutoRetention feature gate is enabled in the cluster configuration before test execution | Tier 1 | P1 |
  | REQ-DEMO-1101-05 | Retention behaviour survives a VM restart | Verify retention pruning still applies to snapshots created after a VM stop/start cycle | Tier 1 / Tier 2 | P1 |
  | REQ-DEMO-1101-06 | Invalid retention values are rejected | Verify setting maxCount to 0 or a negative value is rejected with a validation error | Tier 1 | P2 |

  ### IV. Sign-off and Approval

  * **Reviewers:** [QE Owner]
  * **Approvers:** [Approver]
