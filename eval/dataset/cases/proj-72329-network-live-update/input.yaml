  ## 1. Introduction

  ### 1.1 Purpose

  This Software Test Plan (STP) defines the testing approach, scope, strategy, environment, and high-level test case inventory for the **Network Profile Reference Live Update** feature (PROJ-72329). It answers **what** will be tested and **why**, at a strategic level. Detailed test procedures (preconditions, steps, expected results) are documented separately in the **STD** (Software Test Design, PROJ-78930).

  ### 1.2 Test Framework

  Downstream QE tests are implemented in **Python/pytest** in the [`my-tests`](https://github.com/my-org/my-tests) repository, following the project's [Software Test Description](docs/SOFTWARE_TEST_DESCRIPTION.md) convention. STDs are written as **test descriptions in code** -- Python test stubs with docstrings containing `Preconditions / Steps / Expected`, merged as a Phase 1 PR before automation implementation (Phase 2).

  Test location: `tests/network/profile_live_update/test_profile_ref_live_update.py`

  ### 1.3 Feature Overview

  Workloads using secondary networks refer to a `NetworkProfile` (NP) object via `spec.template.spec.networks[].secondary.networkName`. Prior to this feature, changing the network profile reference required a workload restart.

  This feature introduces the `LiveUpdateNetworkProfileRef` feature gate which, when enabled, allows users to update the network profile reference on a running workload. The change triggers an automatic Live Relocation to a new pod whose network annotation refers to the new network profile, rather than requiring a `RestartRequired` condition and manual reboot.

  ### 1.4 Motivation

  - **Avoid workload disruption**: Workload restart impacts the running application; live relocation is transparent to the workload OS.
  - **Preserve workload interface properties**: Unlike hot-attaching a new interface (which changes MAC address, interface name, etc.), this approach preserves all workload-visible interface properties.
  - **Use case**: Re-assign workloads to a different VLAN, move to a better/worse link, or isolate to a different network segment -- all without workload OS awareness.

