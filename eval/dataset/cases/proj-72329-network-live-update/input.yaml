  ## 4. Test Environment

  ### 4.1 Infrastructure Requirements

  | Component | Requirement |
  |---|---|
  | **Kubernetes Cluster** | Kubernetes 1.x with Example Platform installed |
  | **Platform Version** | Example Platform 4.18+ (supports `LiveUpdateNetworkProfileRef` FG) |
  | **Upstream Version** | v1.8+ (upstream) |
  | **Secondary Network Plugin** | Installed and configured |
  | **Bridge CNI Plugin** | `example-bridge` or `bridge` CNI plugin available |
  | **Worker Nodes** | At least 2 schedulable worker nodes (for live relocation) |
  | **Storage** | Shared storage (e.g., Ceph, NFS) for live relocation support |
  | **Network** | Physical or virtual network supporting VLANs (for realistic network profile testing) |

  ### 4.2 Network Profile Configuration

  Two or more network profiles with different configurations (e.g., different VLAN IDs or different bridges) should be pre-created. Example:

  ```yaml
  apiVersion: networking.example.com/v1
  kind: NetworkProfile
  metadata:
    name: np-vlan10
  spec:
    config: '{
      "cniVersion": "0.3.1",
      "name": "np-vlan10",
      "type": "example-bridge",
      "bridge": "br-test",
      "vlan": 10,
      "macspoofchk": true,
      "ipam": {}
    }'
  ```

  ### 4.3 Feature Gate Enablement

  Via the Platform Operator (downstream):
  ```yaml
  apiVersion: operator.example.com/v1beta1
  kind: PlatformConfig
  spec:
    featureGates:
      LiveUpdateNetworkProfileRef: true
  ```

  Or Platform CR (upstream):
  ```yaml
  apiVersion: platform.example.com/v1
  kind: Platform
  spec:
    configuration:
      developerConfiguration:
        featureGates:
          - LiveUpdateNetworkProfileRef
  ```

