  ## 2. Scope

  ### 2.1 In Scope

  | Area | Description |
  |---|---|
  | Network profile reference live update | Changing `networkName` on a running workload triggers relocation instead of restart |
  | Bridge binding | Secondary network interfaces using `bridge` binding |
  | Live Relocation trigger | Automatic relocation triggered when network profile reference changes |
  | Feature Gate behavior | `LiveUpdateNetworkProfileRef` enable/disable behavior |
  | RestartRequired condition | Verifying correct condition behavior based on FG state |
  | Workload spec sync | Workload instance spec updated with new networkName from workload spec |
  | Multiple networks | Workload with multiple secondary networks, updating one or more network profile refs |
  | DNC compatibility | Behavior on clusters with/without the secondary network plugin's Dynamic Networks Controller |
  | PO integration | Feature gate enabled via the Platform Operator |
  | CLI/API | Changes via `kubectl patch`, `exampctl`, and direct API |

  ### 2.2 Out of Scope

  | Area | Reason |
  |---|---|
  | Moving between different CNI types | Explicitly listed as non-goal in EP #140 |
  | Changing the network binding/plugin | Non-goal |
  | Seamless network connectivity during relocation | Non-goal; brief connectivity interruption is expected |
  | Non-relocatable workloads | Feature requires live relocation capability |
  | Workload OS network reconfiguration (e.g., DHCP renewal) | Out of scope |
  | SR-IOV or other non-bridge bindings | Current scope is bridge binding only (per EP Beta) |
  | Limiting relocation retries for missing network profile | Non-goal per EP |
  | UI/Console testing | Separate test effort |

  ---

  ## 3. Test Strategy

  ### 3.1 Test Levels

  | Level | Description | Responsibility | Framework |
  |---|---|---|---|
  | **Unit Tests** | Controller logic for restart evaluation, relocation evaluation, workload sync | Dev (included in implementation PR) | Go (Ginkgo) |
  | **E2E Tests (Upstream)** | Upstream Ginkgo e2e tests for network profile live update scenarios | Dev + QE | Go (Ginkgo) |
  | **Integration Tests (Downstream)** | Example Platform product-level integration tests | QE | **Python (pytest)** in `my-tests` |
  | **System Tests** | Full cluster-level tests with PO, Kubernetes, real network backends | QE | **Python (pytest)** in `my-tests` |
  | **Regression Tests** | Ensure existing hot-attach/detach, relocation, and network flows are not broken | QE | **Python (pytest)** in `my-tests` |

  ### 3.2 Test Types

  | Type | Purpose |
  |---|---|
  | **Functional** | Core feature functionality per acceptance criteria |
  | **Negative** | Invalid inputs, missing network profiles, unsupported bindings, FG disabled |
  | **Boundary** | Multiple simultaneous network profile changes, rapid successive changes, concurrent operations |
  | **Compatibility** | DNC clusters, different Kubernetes versions, different CNI plugins |
  | **Regression** | Existing network hot-attach, relocation, and workload lifecycle flows |
  | **Upgrade** | Feature behavior across platform upgrades (FG persistence, rollback) |
  | **Scale / Stress** | Many workloads, rapid successive changes |

  ### 3.3 Test Approach

  1. **Feature Gate Gating**: All positive tests run with `LiveUpdateNetworkProfileRef` FG enabled. Selected tests verify gating behavior (FG disabled results in RestartRequired).
  2. **Relocation Verification**: Tests verify that network profile changes trigger Live Relocation (not restart) and that relocation completes successfully.
  3. **Post-Relocation Validation**: After relocation, verify the target pod's network annotation, network connectivity, workload interface preservation (MAC, interface name), and workload/workload instance health.
  4. **Combination Testing**: Test scenarios where network profile ref changes are combined with other workload spec changes.

  ### 3.4 Test Development Workflow

  Following the `my-tests` [two-phase workflow](docs/SOFTWARE_TEST_DESCRIPTION.md):

  | Phase | Deliverable | Description |
  |---|---|---|
  | **Phase 1: STD PR** | Test stubs with docstrings | Python test functions with `Preconditions/Steps/Expected` docstrings, `__test__ = False`. Reviewed for test design completeness. |
  | **Phase 2: Automation PR** | Test implementation | Actual pytest code, fixtures, assertions. `__test__ = False` removed. Reviewed for correctness. |

  ### 3.5 Pytest Markers

  | Marker | Applied To |
  |---|---|
  | `network` | All test cases (component marker) |
  | `ipv4` | Tests verifying L2 connectivity via ping |
  | `gating` | P1 critical tests in CI gating job |
  | `tier3` | Complex/time-consuming tests (scale, stress, race conditions) |
  | `sriov` | TC-14 (non-bridge binding test requiring SR-IOV hardware) |
  | `polarion("PROJ-XXXXX")` | All tests (Polarion traceability -- IDs assigned during Phase 2) |

