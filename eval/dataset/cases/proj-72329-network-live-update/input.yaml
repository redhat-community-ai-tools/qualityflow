  ## 11. Glossary

  | Term | Definition |
  |---|---|
  | **NP** | NetworkProfile -- CRD from `networking.example.com` API group defining a network attachment |
  | **EP** | Enhancement Proposal -- the upstream project's process for proposing significant changes |
  | **FG** | Feature Gate -- mechanism to enable/disable features |
  | **Workload instance** | The running instance of a workload |
  | **DNC** | Dynamic Networks Controller -- secondary network plugin component for in-place hot-attach/detach of networks |
  | **CNI** | Container Network Interface -- standard for configuring network interfaces in Linux containers |
  | **PO** | Platform Operator -- operator managing the Example Platform deployment on Kubernetes |
  | **Bridge binding** | Example Platform network binding connecting the workload to a Linux bridge on the host |
  | **Live Relocation** | Moving a running workload from one node to another without stopping it |
  | **VLAN** | Virtual LAN -- network segmentation technique |
