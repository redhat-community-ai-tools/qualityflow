# --- exactly what was planted, and nothing else ---
constructed_findings:
  - id: P1
    rule_targeted: "Rule B (Section I Meta-Checklist) — empty Section III"
    edit: >-
      Section III's Requirements-to-Tests Mapping table has a header row and zero
      data rows.
    effect: >-
      CRITICAL per Rule B: "Section III has no items or is empty — this is the
      core of the STP and must be filled."
  - id: P2
    rule_targeted: "Rule B — checked checkbox with empty sub-items"
    edit: >-
      Section I.1's Acceptance Criteria item is checked ([x]) with no sub-bullets
      at all.
    effect: "CRITICAL per Rule B: checked but empty details."
  - id: P3
    rule_targeted: "Rule B — unfilled placeholder text"
    edit: >-
      Test Environment (II.3) contains only "[TODO: describe the required test
      environment before review]".
    effect: "CRITICAL per Rule B: required section still carries placeholder text."

