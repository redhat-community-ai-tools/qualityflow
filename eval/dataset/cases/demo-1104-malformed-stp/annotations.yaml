case: demo-1104-malformed-stp
category: known-bad
description: >-
  Structural-breakage probe. The STP carries the three patterns SKILL.md's Rule B
  lists as CRITICAL: an empty Section III table (the core of the STP), a checked
  checklist item with no sub-items (Acceptance Criteria in I.1), and leftover
  placeholder text (Test Environment II.3). Everything else is deliberately
  unremarkable so the criticals stay attributable. A reviewer that approves this
  document, or reports the emptiness as merely MAJOR, has stopped enforcing the
  structural floor.

# --- what the produced review must match ---
expected_verdict: NEEDS_REVISION       # deterministic: 1+ critical blocks approval
expected_critical_findings: 3
critical_findings_tolerance: 2         # 1-5; see rationale
expected_major_findings: 3
expected_minor_findings: 2
major_findings_tolerance: 3            # advisory only — no judge gates on this
minor_findings_tolerance: 2            # advisory only — no judge gates on this

critical_tolerance_rationale: >-
  Three criticals are planted, all Rule B patterns. Lower bound 1 allows a
  reviewer that merges them into a single "document is structurally incomplete"
  finding; upper bound 5 allows one that also raises the Rule K fallout as
  critical (Scope/Goals promise metric coverage while Section III covers nothing,
  and Monitoring is marked Y with no scenario behind it). The verdict has no
  slack: an empty traceability matrix must block.

