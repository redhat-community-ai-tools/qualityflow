  - scenario_id: 4
    test_id: "TS-RHAIRFE-1487-004"
    test_type: "functional"
    priority: "P1"
    priority_comment: "P1 — durable tenant credentials are important but already have partial expiration coverage"
    requirement_id: "REQ-RHAIRFE-1487-03"
    requirement_ids: ["REQ-RHAIRFE-1487-03"]
    stp_scenario_id: "TS-004"
    coverage_status: "PARTIAL_COVERAGE"
    open_questions:
      - "<TBD: product-supported API-key lifetime for months/years; shipped default is 90 days>"
    test_objective:
      title: "Verify API key remains valid at lifetime boundary"
      what: |
        Verify that a tenant API key created at the supported lifetime boundary is accepted
        by the tenant gateway and is scoped to that tenant's identity.
      why: |
        Tenant users need durable credentials without short-lived service-account refresh burden.
        A boundary that silently rejects a valid key or permits cross-tenant use would break both usability and isolation.
      acceptance_criteria:
        - "API-key creation at the supported lifetime boundary succeeds"
        - "The returned key can immediately authorize an inference request through its own tenant gateway"
    specific_preconditions:
      - name: "Tenant and model"
        requirement: "A Ready tenant with a tenant-local model and an authorized tenant user"
        validation: "Tenant reports Ready and model inference succeeds with an existing credential"
      - name: "Lifetime boundary"
        requirement: "The product-supported API-key lifetime boundary is configured and known"
        validation: "API-key configuration reports the supported maximum lifetime"
    test_data:
      api_endpoints: []
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure a tenant API key for the supported lifetime boundary"
          validation: "API-key creation succeeds"
      test_execution:
        - step_id: "TEST-01"
          action: "Send an inference request through the tenant gateway with the boundary-lifetime API key"
          validation: "The request is authorized by the tenant gateway"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Revoke the boundary-lifetime API key"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Boundary-lifetime key authorizes its tenant"
        condition: "Inference through the tenant gateway returns success while the key is valid"
        failure_impact: "Tenants cannot rely on durable, scoped credentials"

