        Confirm the request is routed to the declared provider and returns a usable response.
      why: "Declarative provider and model selection is a core administrator workflow."
      acceptance_criteria:
        - "A request for the declared model returns a successful inference response"
    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest"
    specific_preconditions:
      - name: "Declared provider credential"
        requirement: "Provider credential Secret is available and labeled for watching"
        validation: "oc get secret <provider-secret> -o jsonpath='{.metadata.labels.ogx\\.io/watch}'"
      - name: "Declared model"
        requirement: "OGXServer declares the model and provider reference"
        validation: "Inspect spec.resources.models"
    test_data:
