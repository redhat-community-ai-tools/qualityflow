scenarios:
  - scenario_id: "1"
    test_id: "TS-RHAISTRAT-1061-001"
    test_type: "functional"
    priority: "P0"
    priority_comment: "P0 — minimal declarative deployment is the primary customer workflow"
    mvp: true
    requirement_id: "RHAISTRAT-1061"
    requirement_ids: ["RHAISTRAT-1061"]
    stp_scenario_id: "TS-01"
    coverage_status: "NEW"
    test_objective:
      title: "Verify documented minimal configuration starts a usable server"
      what: |
        Deploy the documented minimal OGXServer declaration with only distribution and declarative runtime fields.
        Confirm the generated configuration is mounted and the server becomes usable without a complete custom template.
      why: |
        Administrators need a supported path that avoids maintaining a versioned complete runtime template.
        If minimal input cannot produce a usable server, the main feature objective fails.
      acceptance_criteria:
        - "An OGXServer created from the documented minimal declaration reports Ready"
        - "The generated config.yaml is mounted at /etc/ogx/config.yaml"
    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Go testing"
    specific_preconditions:
      - name: "Documented minimal OGXServer"
        requirement: "OGXServer uses the documented minimal declarative fields and no overrideConfig"
        validation: "Inspect spec.providers, spec.resources, spec.storage, and spec.disabledAPIs"
    test_data:
      resource_definitions:
        - name: "minimal-runtime-config"
          type: "OGXServer"
          yaml: |
            apiVersion: ogx.io/v1beta1
            kind: OGXServer
            metadata:
              name: minimal-runtime-config
            spec:
              distribution:
                name: starter
              providers:
                inference:
                  remote:
                    openai:
                      - id: openai-primary
                        apiKey:
                          name: openai-creds
                          key: api-key
              resources:
                models:
                  - name: gpt-4o-mini
                    provider: openai-primary
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create the referenced credential and minimal OGXServer"
          command: "oc apply -f <test manifest>"
          validation: "The referenced Secret and OGXServer exist in the same namespace"
      test_execution:
        - step_id: "TEST-01"
          action: "Wait for the OGXServer to become Ready"
          command: "oc wait ogxserver/minimal-runtime-config --for=condition=Ready"
          validation: "The Ready condition becomes True"
        - step_id: "TEST-02"
          action: "Execute a server version request"
          command: "GET /v1/version"
          validation: "The server returns a successful version response"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete the OGXServer"
          command: "oc delete ogxserver/minimal-runtime-config"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "The minimal declarative OGXServer is usable with generated configuration"
        condition: "OGXServer is Ready, generated config.yaml is mounted at /etc/ogx/config.yaml, and GET /v1/version succeeds"
        failure_impact: "Customers cannot deploy supported runtime settings without a complete custom template"
    dependencies:
      kubernetes_resources: ["OGXServer: minimal-runtime-config"]
      external_tools: ["oc"]
      scenario_specific_rbac: ["Permission to create Secrets and OGXServers in the test namespace"]

