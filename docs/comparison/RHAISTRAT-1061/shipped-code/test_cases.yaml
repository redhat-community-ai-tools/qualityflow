          command: "POST /v1/chat/completions"
          validation: "The inference endpoint returns a successful response"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete the OGXServer and credential"
          command: "oc delete ogxserver/declared-inference-server"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Declared model serves an inference request"
        condition: "Inference request returns success and references the declared model"
        failure_impact: "Administrators cannot use declarative provider and model selection"
