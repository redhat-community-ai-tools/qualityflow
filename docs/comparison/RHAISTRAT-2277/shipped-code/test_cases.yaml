      acceptance_criteria:
        - "Each readiness condition reports the expected True or False state for its scenario"
    classification:
      test_type: "integration"
      scope: "Multi-component"
      automation_approach: "pytest status workflow"
    specific_preconditions:
      - name: "Operator-managed OGXServer"
