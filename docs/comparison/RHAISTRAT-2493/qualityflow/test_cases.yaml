      RELEASE
    validation: Compare release and node inventory with STP II.3 before execution
  - name: Reference voice profile
    requirement: Two H100 80GB GPUs; one serving replica; one concurrent user; English prompts
    validation: Compare hardware allocation and harness configuration with STP I.1
  operators:
  - name: Model-serving platform, KServe and GPU enablement
    validation: Confirm installed operators match release inventory
  cluster_configuration:
    topology: Multi-node
    cpu_virtualization: N/A
    storage: Trusted safetensors on PVC; measure actual capacity; approximately 95 GB planning estimate
    network: External OpenShift Route; standard 30-second timeout; metrics access and restricted-egress test namespace
