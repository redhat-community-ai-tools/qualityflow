      src/ogx/providers/utils/inference/openai_mixin.py and
      tests/ogx/gemini/test_chat_completions.py expose normal streaming only.
  - scenario: 14
    why: >-
      src/ogx/core/request_headers.py:81 parses only X-OGX-Provider-Data and
      x-ogx-provider-data; no x-llamastack-provider-data interface exists.
  - scenario: 19
    why: >-
      The checkout has no selected MCP server harness;
      tests/ogx/gemini/test_mcp.py identifies the MCP wiring as outstanding.
  - scenario: 20
    why: >-
      The checkout has no MCP server or unavailable-tool harness;
      tests/ogx/gemini/test_mcp.py and tests/ogx/gemini/test_tool_calling.py
      provide no injectable MCP fault control.
  - scenario: 22
    why: >-
      tests/ogx/server_config.py:114 activates Gemini only by injecting
      GEMINI_API_KEY from the distribution Secret, and no credential-free
      isolated deployment fixture exists in the target directory.
  - scenario: 23
    why: >-
      The tests checkout has no release-approved restart or upgrade lifecycle
      workflow for this scenario; tests/ogx/server_config.py only builds the
      server specification.
  - scenario: 24
    why: >-
      No isolated endpoint fault control exists in the public client or suite;
      tests/ogx/gemini/test_mcp.py and tests/ogx/gemini/test_chat_completions.py
      have no block-and-restore Gemini endpoint harness.
