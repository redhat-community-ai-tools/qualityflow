      - test_function: "test_tenant_id_column_takes_precedence_when_present"
        test_file: "tests/unit/cli/migrate/test_tenant.py"
        behavior_tested: "Present source tenant identifiers are preserved"
      - test_function: "test_source_owner_principal_takes_precedence"
        test_file: "tests/unit/cli/migrate/test_owner.py"
        behavior_tested: "Present source owner principals are preserved as owner subjects"
    test_objective:
      title: "Verify source tenant and owner mappings"
      what: "Verify that non-empty source tenant_id values become target tenant_id values and non-empty source owner_principal values become target owner_subject values."
      why: "Migrated state must remain attributable to its original tenant and owner after the OGX-to-Praxis transition."
      acceptance_criteria:
        - "Present source tenant_id and owner_principal values are preserved in their target ownership columns"
    classification:
      test_type: "functional"
      scope: "Single-component"
      automation_approach: "pytest"
    specific_preconditions:
      - name: "Source ownership data"
        requirement: "OGX source rows contain non-empty tenant_id and owner_principal values"
        validation: "Query the source ownership columns"
    test_data:
      source_constant_refs:
        - "SOURCE_TENANT_FIELD"
        - "SOURCE_OWNER_FIELD"
        - "TARGET_OWNER_FIELD"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create source rows with non-empty tenant_id and owner_principal values"
          validation: "Source ownership columns are populated"
      test_execution:
        - step_id: "TEST-01"
          action: "Execute the OGX-to-Praxis migration transformation"
          validation: "Transformation completes without a missing-ownership error"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove isolated migration data"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Target rows preserve the source tenant and owner identity"
        condition: "target tenant_id equals source tenant_id and target owner_subject equals source owner_principal for every row"
        failure_impact: "Migrated state is attributed to the wrong tenant or owner"
