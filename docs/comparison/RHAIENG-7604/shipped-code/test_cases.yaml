scenarios:
  - scenario_id: "1"
    test_id: "TS-RHAIENG-7604-001"
    test_type: "functional"
    priority: "P0"
    priority_comment: "P0 — direct ownership mapping is the core migration behavior"
    mvp: true
    requirement_id: "RHAIENG-7604"
    requirement_ids: ["RHAIENG-7604"]
    stp_scenario_id: "TS-01"
    coverage_status: "EXISTING_COVERAGE"
