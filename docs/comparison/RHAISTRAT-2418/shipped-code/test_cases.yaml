common_preconditions:
  infrastructure:
    - name: "OpenShift"
      requirement: "OpenShift platform supported by RHOAI 3.7 EA"
      validation: "oc get clusteroperators"
    - name: "RHOAI"
      requirement: "RHOAI 3.7 EA monitoring components installed"
      validation: "oc get datasciencecluster"
    - name: "Authorino"
      requirement: "Authorino deployed in rh-connectivity-link or kuadrant-system"
      validation: "oc get servicemonitor authorino-server-metrics -A"
    - name: "Perses"
      requirement: "Perses CRDs and the auth decisions dashboard deployment path available"
      validation: "oc get crd persesdashboards.perses.dev"
    - name: "Cluster Prometheus"
      requirement: "cluster-prometheus-datasource resolves the OpenShift Monitoring Thanos Querier"
      validation: "oc get thanosquerier -A"
  operators:
    - name: "RHOAI monitoring"
      namespace: "redhat-ods-monitoring"
      validation: "oc get datasciencecluster"
    - name: "Authorino"
      namespace: "rh-connectivity-link or kuadrant-system"
      validation: "oc get authorino -A"
  cluster_configuration:
    topology: "Multi-node"
    cpu_virtualization: "Standard"
    storage: "Standard cluster storage"
    network: "Standard in-cluster networking between the model gateway, Authorino, Prometheus, and Perses"
  rbac_requirements:
    - permission: "get on PersesDashboard"
      scope: "Namespace: redhat-ods-monitoring"
      validation: "oc auth can-i get persesdashboards.perses.dev"
    - permission: "get on PrometheusRule"
      scope: "Namespace: rh-connectivity-link or kuadrant-system"
      validation: "oc auth can-i get prometheusrules.monitoring.coreos.com"

scenarios:
  - scenario_id: "1"
    test_id: "TS-RHAISTRAT-2418-001"
    test_type: "functional"
    priority: "P0"
    priority_comment: "P0 - Per-policy decision collection is the primary release requirement."
    requirement_id: "REQ-RHAISTRAT-2418-01"
    requirement_ids: ["REQ-RHAISTRAT-2418-01"]
    stp_scenario_id: "TS-01"
    coverage_status: "NEW"
    test_objective:
      title: "Verify per-policy authorization metrics are collected"
      what: "Send authorization traffic and verify Authorino decision counters are collected with policy, namespace, and status labels."
      why: "Operators need policy-level authorization visibility without inspecting service logs."
      acceptance_criteria:
        - "auth_server_authconfig_response_status returns non-empty per-policy results with authconfig, namespace, and status labels."
    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "pytest cluster integration"
    specific_preconditions:
      - name: "Authorization traffic source"
        requirement: "A deployed model or inference service has an authorization policy and can receive authorized and denied requests."
        validation: "Model endpoint and credentials are available."
    test_data:
      api_endpoints:
        - operation: "Query per-policy auth decisions"
          method: "GET"
          path: "/api/v1/query"
          expected_status: 200
          body: "auth_server_authconfig_response_status"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Prepare a model or inference service with an authorization policy."
          validation: "The protected endpoint is ready to receive requests."
      test_execution:
        - step_id: "TEST-01"
          action: "Send authorized and denied requests to the protected model endpoint."
          validation: "The requests produce allow and deny decisions."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary request credentials."
          command: "Revoke temporary test credentials."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Per-policy authorization decision counters are present."
        condition: "auth_server_authconfig_response_status returns non-empty results with authconfig, namespace, and status labels."
        failure_impact: "Operators cannot identify which authorization policy allowed or denied requests."
    dependencies:
      kubernetes_resources:
        - "Authorino ServiceMonitor"
        - "Model or inference service"
      external_tools:
        - "Prometheus API"
      scenario_specific_rbac:
        - "Permission to query the cluster Prometheus datasource."

