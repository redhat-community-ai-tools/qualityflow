  - scenario_id: "10"
    test_id: "TS-RHAISTRAT-1246-010"
    test_type: "functional"
    priority: "P1"
    priority_comment: "P1 — Malformed overrides must not corrupt valid configuration."
    mvp: false
    requirement_id: "REQ-RHAISTRAT-1246-08"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-08"
    stp_scenario_id: "TS-10"
    coverage_status: "NEW"
    test_objective:
      title: "Verify malformed credential override rejection"
      what: |
        Confirm that a malformed x-ogx-provider-data header is rejected without
        changing the provider's configured API key.
      why: |
        A malformed override must fail safely rather than silently falling back
        to or corrupting another tenant's credential.
      acceptance_criteria:
        - "A malformed override returns a 4xx response and the configured key remains usable."
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "pytest against the deployed OGX API"
    specific_preconditions:
      - name: "Valid configured credential"
        requirement: "The provider is configured with a valid Anthropic key."
        validation: "A request without the override succeeds."
    test_data:
      resource_definitions: []
      api_endpoints:
        - operation: "create chat completion with malformed override"
          method: "POST"
          path: "/v1/chat/completions"
          expected_status: 400
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "Hello"}]
            }
          headers:
            x-ogx-provider-data: "{not-json}"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure the provider with a valid Anthropic key."
          command: "Set ANTHROPIC_API_KEY to the valid key."
          validation: "The provider is active."
      test_execution:
        - step_id: "TEST-01"
          action: "Send a request with a malformed x-ogx-provider-data header."
          command: "curl -s -w '%{http_code}' -X POST ${OGX_ROUTE}/v1/chat/completions -H 'x-ogx-provider-data: {not-json}' -d @request.json"
          validation: "The request is rejected with a 4xx response."
        - step_id: "TEST-02"
          action: "Send a follow-up request without the override header."
          command: "curl -s -X POST ${OGX_ROUTE}/v1/chat/completions -d @request.json"
          validation: "The configured key still authenticates the request."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove the temporary request artifact."
          command: "Delete the request JSON file."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "A malformed override is rejected and the configured key remains usable."
        condition: "first status is 4xx and follow-up status is 200"
        failure_impact: "A malformed request could break valid tenant authentication."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Anthropic Python SDK"
      scenario_specific_rbac:
        - "Permission to call the chat completions API."

