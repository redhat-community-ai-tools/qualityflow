scenarios:
  - scenario_id: "1"
    test_id: "TS-RHAISTRAT-1246-001"
    test_type: "functional"
    priority: "P0"
    priority_comment: "P0 — Provider availability is the release-blocking distribution prerequisite."
    mvp: true
    requirement_id: "REQ-RHAISTRAT-1246-01"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-01"
    stp_scenario_id: "TS-01"
    coverage_status: "NEW"
    test_objective:
      title: "Verify provider appears after deployment"
      what: |
        Confirm that a deployed RHOAI OGX distribution exposes the native
        remote::anthropic provider through its provider inventory.
      why: |
        Customers must be able to select Claude models without installing a
        separate provider adapter or using an OpenAI-compatible workaround.
      acceptance_criteria:
        - "GET /v1/providers includes an entry whose provider_type is remote::anthropic."
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "pytest against the deployed OGX API"
    specific_preconditions:
      - name: "Native provider enabled"
        requirement: "The OGX distribution is deployed with remote::anthropic included."
        validation: "The provider list contains remote::anthropic."
    test_data:
      resource_definitions: []
      api_endpoints:
        - operation: "list providers"
          method: "GET"
          path: "/v1/providers"
          expected_status: 200
          body: ""
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Deploy the OGX distribution with the Anthropic provider enabled."
          command: "oc apply -f ${OGX_DISTRIBUTION_MANIFEST}"
          validation: "The OGX server pod reaches Ready."
      test_execution:
        - step_id: "TEST-01"
          action: "Query the OGX provider inventory."
          command: "curl -s ${OGX_ROUTE}/v1/providers"
          validation: "The response contains remote::anthropic."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove the test OGX distribution."
          command: "oc delete -f ${OGX_DISTRIBUTION_MANIFEST}"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "The provider inventory includes remote::anthropic."
        condition: "provider_type == remote::anthropic"
        failure_impact: "Claude models cannot be selected through the native provider."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Anthropic Python SDK"
      scenario_specific_rbac:
        - "Permission to read the OGX provider inventory."

  - scenario_id: "2"
    test_id: "TS-RHAISTRAT-1246-002"
    test_type: "functional"
    priority: "P0"
    priority_comment: "P0 — Native configuration replaces the release-blocking authentication workaround."
    mvp: true
    requirement_id: "REQ-RHAISTRAT-1246-02"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-02"
    stp_scenario_id: "TS-02"
    coverage_status: "NEW"
    test_objective:
      title: "Verify configuration without header workaround"
      what: |
        Confirm that OGX can serve Claude models when the Anthropic provider is
        configured with provider_type remote::anthropic and an environment-backed
        API key, without a network.headers override.
      why: |
        The previous remote::openai workaround could not support per-request
        credentials and required provider-specific header injection.
      acceptance_criteria:
        - "A chat completion succeeds using the native provider configuration."
        - "The provider configuration contains no network.headers workaround."
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "pytest against the deployed OGX API"
    specific_preconditions:
      - name: "Native provider configuration"
        requirement: "The Anthropic provider is configured with provider_type remote::anthropic."
        validation: "The provider configuration exposes provider_type remote::anthropic."
      - name: "Valid Anthropic credential"
        requirement: "ANTHROPIC_API_KEY resolves to a valid API key."
        validation: "The configured provider can authenticate to Anthropic."
    test_data:
      resource_definitions:
        - name: "anthropic-provider"
          type: "Provider configuration"
          yaml: |
            provider_id: anthropic
            provider_type: remote::anthropic
            config:
              api_key: "${env.ANTHROPIC_API_KEY:=}"
      api_endpoints:
        - operation: "create chat completion"
          method: "POST"
          path: "/v1/chat/completions"
          expected_status: 200
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "Reply with ACK."}]
            }
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure the native Anthropic provider."
          command: "Apply provider_type remote::anthropic and api_key ${env.ANTHROPIC_API_KEY:=}."
          validation: "The provider configuration is accepted."
      test_execution:
        - step_id: "TEST-01"
          action: "Send a chat completion to the configured Claude model."
          command: "curl -s -X POST ${OGX_ROUTE}/v1/chat/completions -d @request.json"
          validation: "The response contains a non-empty assistant message."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove the test provider configuration."
          command: "Delete the temporary provider configuration."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "The native configuration serves a Claude completion without network.headers."
        condition: "response.choices[0].message.content is non-empty and network.headers is absent"
        failure_impact: "Customers cannot migrate from the OpenAI-compatible workaround."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Anthropic Python SDK"
      scenario_specific_rbac:
        - "Permission to update the OGX provider configuration."

  - scenario_id: "3"
    test_id: "TS-RHAISTRAT-1246-003"
    test_type: "integration"
    priority: "P0"
    priority_comment: "P0 — Streaming and temperature are core Claude usage paths."
    mvp: true
    requirement_id: "REQ-RHAISTRAT-1246-03"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-03"
    stp_scenario_id: "TS-03"
    coverage_status: "PARTIAL_COVERAGE"
    covered_by:
      - test_function: "test_messages_streaming_basic"
        test_file: "tests/integration/messages/test_messages.py"
        behavior_tested: "Streaming returns a valid Anthropic event sequence and content deltas."
      - test_function: "test_messages_non_streaming_with_temperature"
        test_file: "tests/integration/messages/test_messages.py"
        behavior_tested: "Non-streaming requests accept a temperature parameter."
    test_objective:
      title: "Verify streaming completion with temperature"
      what: |
        Confirm that a streaming chat completion preserves the requested
        temperature value and returns a complete Anthropic event sequence.
      why: |
        Application developers rely on streaming and sampling controls to build
        responsive Claude-based workflows.
      acceptance_criteria:
        - "A streaming request with temperature 0.7 returns content deltas and a stop event."
    classification:
      test_type: "Integration"
      scope: "Multi-component"
      automation_approach: "pytest against the deployed OGX API"
    specific_preconditions:
      - name: "Active Anthropic provider"
        requirement: "The native provider is active with a valid API key."
        validation: "The provider list includes remote::anthropic."
    test_data:
      resource_definitions: []
      api_endpoints:
        - operation: "create streaming chat completion"
          method: "POST"
          path: "/v1/chat/completions"
          expected_status: 200
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "Explain streaming."}],
              "stream": true,
              "temperature": 0.7
            }
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Activate the native Anthropic provider."
          command: "Set ANTHROPIC_API_KEY and start the OGX distribution."
          validation: "The provider is ready to serve requests."
      test_execution:
        - step_id: "TEST-01"
          action: "Send a streaming chat completion with temperature 0.7."
          command: "curl -N -X POST ${OGX_ROUTE}/v1/chat/completions -d @stream-request.json"
          validation: "The stream emits content deltas and terminates with stop."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close the streaming response."
          command: "Close the HTTP stream."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Streaming preserves temperature and returns a complete response."
        condition: "stream contains non-empty content and finish_reason == stop"
        failure_impact: "Streaming Claude workflows lose responsiveness or sampling control."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Anthropic Python SDK"
      scenario_specific_rbac:
        - "Permission to call the chat completions API."

  - scenario_id: "4"
    test_id: "TS-RHAISTRAT-1246-004"
    test_type: "e2e"
    priority: "P0"
    priority_comment: "P0 — Tool calling is required across both user-facing API surfaces."
    mvp: true
    requirement_id: "REQ-RHAISTRAT-1246-04"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-04"
    stp_scenario_id: "TS-04"
    coverage_status: "PARTIAL_COVERAGE"
    covered_by:
      - test_function: "test_messages_with_tool_definitions"
        test_file: "tests/integration/messages/test_messages.py"
        behavior_tested: "Message requests with tool definitions complete successfully."
      - test_function: "test_empty_tool_parameters_normalized"
        test_file: "tests/unit/providers/inference/test_remote_anthropic.py"
        behavior_tested: "Empty tool parameter schemas are normalized for Anthropic."
    test_objective:
      title: "Verify tool calls across both APIs"
      what: |
        Confirm that Claude tool calls work through both the chat completions
        and responses APIs using the same function definition.
      why: |
        Customers use both API surfaces, and tool-based workflows are a primary
        reason to consume Claude through OGX.
      acceptance_criteria:
        - "Both APIs return a well-formed function tool call for the same tool definition."
    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest against the deployed OGX API"
    specific_preconditions:
      - name: "Tool definition available"
        requirement: "A get_weather function tool is defined for both API requests."
        validation: "The tool schema is accepted by both APIs."
    test_data:
      resource_definitions: []
      api_endpoints:
        - operation: "create chat completion with tools"
          method: "POST"
          path: "/v1/chat/completions"
          expected_status: 200
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "What is the weather in London?"}],
              "tools": [{"type": "function", "function": {"name": "get_weather", "parameters": {"type": "object", "properties": {"location": {"type": "string"}}, "required": ["location"]}}}]
            }
        - operation: "create response with tools"
          method: "POST"
          path: "/v1/responses"
          expected_status: 200
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "input": "What is the weather in London?",
              "tools": [{"type": "function", "name": "get_weather", "parameters": {"type": "object", "properties": {"location": {"type": "string"}}, "required": ["location"]}}]
            }
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Activate the native Anthropic provider."
          command: "Set ANTHROPIC_API_KEY and start the OGX distribution."
          validation: "The provider is ready to serve requests."
      test_execution:
        - step_id: "TEST-01"
          action: "Send a chat completion request containing the get_weather tool."
          command: "curl -s -X POST ${OGX_ROUTE}/v1/chat/completions -d @chat-tool-request.json"
          validation: "The assistant returns a get_weather tool call."
        - step_id: "TEST-02"
          action: "Send a responses API request containing the same tool."
          command: "curl -s -X POST ${OGX_ROUTE}/v1/responses -d @responses-tool-request.json"
          validation: "The response contains a get_weather tool invocation."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary request fixtures."
          command: "Delete the request JSON files."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Both APIs return a well-formed get_weather tool call."
        condition: "chat.tool_calls[0].function.name == get_weather and responses.tool_call.name == get_weather"
        failure_impact: "Tool-based Claude workflows fail on one or both API surfaces."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Anthropic Python SDK"
      scenario_specific_rbac:
        - "Permission to call the chat completions and responses APIs."

  - scenario_id: "5"
    test_id: "TS-RHAISTRAT-1246-005"
    test_type: "e2e"
    priority: "P1"
    priority_comment: "P1 — MCP integration extends Claude tooling beyond direct function calls."
    mvp: false
    requirement_id: "REQ-RHAISTRAT-1246-05"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-05"
    stp_scenario_id: "TS-05"
    coverage_status: "NEW"
    test_objective:
      title: "Verify MCP tool use with Anthropic model"
      what: |
        Confirm that a Claude model served through OGX can invoke a tool exposed
        by a configured MCP server and incorporate the tool output into its response.
      why: |
        MCP integration lets customers connect Claude models to external tools
        and data sources without writing custom adapters.
      acceptance_criteria:
        - "A Claude request that should use an MCP tool returns a response reflecting that tool's output."
    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with a controlled MCP server"
    specific_preconditions:
      - name: "Controlled MCP server"
        requirement: "An MCP server exposing a deterministic tool is reachable from OGX."
        validation: "The MCP server responds to a health check."
    test_data:
      resource_definitions:
        - name: "mcp-server"
          type: "MCP server"
          yaml: |
            server:
              transport: stdio
              command: ${MCP_SERVER_COMMAND}
      api_endpoints:
        - operation: "create message with MCP tool"
          method: "POST"
          path: "/v1/messages"
          expected_status: 200
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "Use the MCP tool to answer."}]
            }
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Start the controlled MCP server."
          command: "Start the MCP server process."
          validation: "The MCP server reports readiness."
      test_execution:
        - step_id: "TEST-01"
          action: "Send a Claude message that should trigger the MCP tool."
          command: "curl -s -X POST ${OGX_ROUTE}/v1/messages -d @mcp-request.json"
          validation: "The response references the MCP tool result."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Stop the controlled MCP server."
          command: "Terminate the MCP server process."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Claude uses the MCP tool and incorporates its output."
        condition: "response.content contains the MCP tool output"
        failure_impact: "Customers cannot connect Claude models to MCP-backed tools."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Controlled MCP server"
      scenario_specific_rbac:
        - "Permission to call the messages API."

  - scenario_id: "6"
    test_id: "TS-RHAISTRAT-1246-006"
    test_type: "functional"
    priority: "P1"
    priority_comment: "P1 — Per-request credentials enable multi-tenant authentication."
    mvp: false
    requirement_id: "REQ-RHAISTRAT-1246-06"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-06"
    stp_scenario_id: "TS-06"
    coverage_status: "PARTIAL_COVERAGE"
    covered_by:
      - test_function: "test_provider_data_api_key_overrides_config"
        test_file: "tests/unit/providers/inference/test_remote_anthropic.py"
        behavior_tested: "anthropic_api_key provider data overrides the configured key."
    test_objective:
      title: "Verify per-request credential override"
      what: |
        Confirm that an x-ogx-provider-data header carrying anthropic_api_key
        authenticates a request in place of the configured API key.
      why: |
        Multi-tenant deployments need each request to use its own Anthropic
        credential without changing shared provider configuration.
      acceptance_criteria:
        - "A request with a secondary key in x-ogx-provider-data succeeds."
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "pytest against the deployed OGX API"
    specific_preconditions:
      - name: "Two valid Anthropic credentials"
        requirement: "A configured key and a secondary valid key are available."
        validation: "Both keys can authenticate to Anthropic."
    test_data:
      resource_definitions: []
      api_endpoints:
        - operation: "create chat completion with override"
          method: "POST"
          path: "/v1/chat/completions"
          expected_status: 200
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "Hello"}]
            }
          headers:
            x-ogx-provider-data: '{"anthropic_api_key": "${ANTHROPIC_SECONDARY_KEY}"}'
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure the provider with the primary Anthropic key."
          command: "Set ANTHROPIC_API_KEY to the primary key."
          validation: "The provider is active."
      test_execution:
        - step_id: "TEST-01"
          action: "Send a chat completion with the secondary key in x-ogx-provider-data."
          command: "curl -s -X POST ${OGX_ROUTE}/v1/chat/completions -H 'x-ogx-provider-data: {\"anthropic_api_key\": \"${ANTHROPIC_SECONDARY_KEY}\"}' -d @request.json"
          validation: "The request succeeds using the secondary key."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove the temporary request artifact."
          command: "Delete the request JSON file."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "The per-request anthropic_api_key override authenticates the request."
        condition: "response.choices[0].message.content is non-empty"
        failure_impact: "Multi-tenant requests cannot use tenant-specific Anthropic credentials."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Anthropic Python SDK"
      scenario_specific_rbac:
        - "Permission to call the chat completions API."

  - scenario_id: "7"
    test_id: "TS-RHAISTRAT-1246-007"
    test_type: "e2e"
    priority: "P1"
    priority_comment: "P1 — Concurrent credential isolation protects multi-tenant security."
    mvp: false
    requirement_id: "REQ-RHAISTRAT-1246-06"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-06"
    stp_scenario_id: "TS-07"
    coverage_status: "NEW"
    test_objective:
      title: "Verify concurrent credential isolation"
      what: |
        Confirm that concurrent requests using different per-request Anthropic
        credentials authenticate independently without cross-request leakage.
      why: |
        A credential leak or race would let one tenant consume another tenant's
        Anthropic quota or data.
      acceptance_criteria:
        - "Concurrent requests with two different override keys each succeed with their own credentials."
    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with concurrent API requests"
    specific_preconditions:
      - name: "Two valid per-request credentials"
        requirement: "Two distinct valid Anthropic keys are available."
        validation: "Each key can authenticate independently."
    test_data:
      resource_definitions: []
      api_endpoints:
        - operation: "create concurrent chat completions"
          method: "POST"
          path: "/v1/chat/completions"
          expected_status: 200
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "Hello"}]
            }
          headers:
            x-ogx-provider-data: '{"anthropic_api_key": "${ANTHROPIC_TENANT_KEY}"}'
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Prepare two requests with different override keys."
          command: "Create two request payloads with distinct anthropic_api_key values."
          validation: "Both payloads are valid."
      test_execution:
        - step_id: "TEST-01"
          action: "Send both requests concurrently."
          command: "Run two chat completion requests in parallel."
          validation: "Both requests complete successfully."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove the temporary request artifacts."
          command: "Delete the request JSON files."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Concurrent requests authenticate with their own credentials."
        condition: "both responses succeed and neither response exposes the other key"
        failure_impact: "Tenant credentials could leak across concurrent requests."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Anthropic Python SDK"
      scenario_specific_rbac:
        - "Permission to call the chat completions API concurrently."

