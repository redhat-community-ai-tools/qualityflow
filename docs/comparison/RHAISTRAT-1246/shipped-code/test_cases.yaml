  - scenario_id: "12"
    test_id: "TS-RHAISTRAT-1246-012"
    test_type: "e2e"
    priority: "P1"
    priority_comment: "P1 — Migration must preserve existing provider configurations."
    mvp: false
    requirement_id: "REQ-RHAISTRAT-1246-09"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-09"
    stp_scenario_id: "TS-12"
    coverage_status: "NEW"
    test_objective:
      title: "Verify migration preserves provider configuration"
      what: |
        Confirm that an existing remote::openai workaround configuration remains
        usable after the native Anthropic provider is added or an upgrade is performed.
      why: |
        Existing customer deployments must not lose inference capability when
        they gain the native provider.
      acceptance_criteria:
        - "An existing remote::openai configuration still serves a completion after upgrade."
    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest upgrade workflow"
    specific_preconditions:
      - name: "Legacy provider configuration"
        requirement: "A remote::openai provider configuration with Anthropic headers exists."
        validation: "The legacy provider can serve a completion before upgrade."
    test_data:
      resource_definitions:
        - name: "legacy-anthropic-provider"
          type: "Provider configuration"
          yaml: |
            provider_type: remote::openai
            config:
              network:
                headers:
                  x-api-key: "${env.EXTERNAL_MODEL_PROVIDER_API_KEY:=placeholder}"
                  anthropic-version: "2023-06-01"
      api_endpoints:
        - operation: "create chat completion after upgrade"
          method: "POST"
          path: "/v1/chat/completions"
          expected_status: 200
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "Hello"}]
            }
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Deploy a version without the native Anthropic provider."
          command: "Install the pre-upgrade OGX distribution."
          validation: "The legacy provider serves a completion."
      test_execution:
        - step_id: "TEST-01"
          action: "Upgrade to the version that includes remote::anthropic."
          command: "Apply the RHOAI 3.5 EA2 upgrade."
          validation: "The upgrade completes successfully."
        - step_id: "TEST-02"
          action: "Send the same completion request through the legacy provider."
          command: "curl -s -X POST ${OGX_ROUTE}/v1/chat/completions -d @legacy-request.json"
          validation: "The legacy provider still returns a completion."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove the upgrade test deployment."
          command: "Delete the OGX distribution used for upgrade testing."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "The legacy provider configuration remains usable after upgrade."
        condition: "post-upgrade response.choices[0].message.content is non-empty"
        failure_impact: "Existing customers lose Anthropic access during upgrade."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
        - "Anthropic Python SDK"
      scenario_specific_rbac:
        - "Permission to upgrade the OGX distribution."

