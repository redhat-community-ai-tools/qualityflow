  - scenario_id: "9"
    test_id: "TS-RHAISTRAT-1246-009"
    test_type: "functional"
    priority: "P1"
    priority_comment: "P1 — Safe authentication failure protects credential confidentiality."
    mvp: false
    requirement_id: "REQ-RHAISTRAT-1246-08"
    requirement_ids:
      - "REQ-RHAISTRAT-1246-08"
    stp_scenario_id: "TS-09"
    coverage_status: "PARTIAL_COVERAGE"
