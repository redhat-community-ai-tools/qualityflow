        behavior_tested: "Missing key fails before an upstream request is sent."
    test_objective:
      title: "Verify authentication failure without credential leakage"
      what: |
        Confirm that an invalid or missing Anthropic credential produces a safe
        client error and does not expose the credential in responses or logs.
      why: |
        Authentication failures must not turn into secret disclosure or
        unhandled server errors.
      acceptance_criteria:
        - "An invalid credential returns a 4xx response without credential material."
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "pytest against the deployed OGX API"
    specific_preconditions:
      - name: "Invalid Anthropic credential"
        requirement: "The provider is configured with a deliberately invalid API key."
        validation: "The provider is active but authentication will fail."
    test_data:
      resource_definitions: []
      api_endpoints:
        - operation: "create chat completion with invalid key"
          method: "POST"
          path: "/v1/chat/completions"
          expected_status: 401
          body: |
            {
              "model": "claude-haiku-4-5-20251001",
              "messages": [{"role": "user", "content": "Hello"}]
            }
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure the provider with an invalid Anthropic key."
          command: "Set ANTHROPIC_API_KEY to an invalid value."
          validation: "The provider is active."
      test_execution:
        - step_id: "TEST-01"
          action: "Send a chat completion request."
          command: "curl -s -w '%{http_code}' -X POST ${OGX_ROUTE}/v1/chat/completions -d @request.json"
          validation: "The request returns a 4xx authentication error."
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Restore a valid provider credential."
          command: "Set ANTHROPIC_API_KEY back to the valid key."
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Authentication failure is safe and does not leak the credential."
        condition: "status is 4xx and response and logs do not contain the key"
        failure_impact: "Credential material could be exposed to clients or operators."
    dependencies:
      kubernetes_resources:
        - "Deployment: OGX distribution"
      external_tools:
